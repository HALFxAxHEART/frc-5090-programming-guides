<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470">
<rect width="900" height="470" fill="#ffffff"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000AB5"/>
  </marker>
</defs>
<g font-family="Inter, Arial, sans-serif" fill="#16181d">
<text x="450" y="30" font-size="19" font-weight="700" text-anchor="middle">Two ratios, split at the sensor</text>
<text x="450" y="52" font-size="14" text-anchor="middle">Example arm: Kraken, 45:1 gearbox, CANcoder on the gearbox output, then a 16T to 48T chain stage (3:1) to the arm</text>

<!-- boxes -->
<rect x="40" y="90" width="180" height="90" rx="10" fill="#000AB5"/>
<text x="130" y="128" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">Motor rotor</text>
<text x="130" y="150" font-size="13" text-anchor="middle" fill="#ffffff">(Talon's built-in sensor)</text>

<rect x="360" y="90" width="180" height="90" rx="10" fill="#FFA700"/>
<text x="450" y="128" font-size="16" font-weight="700" text-anchor="middle">CANcoder</text>
<text x="450" y="150" font-size="13" text-anchor="middle">(the remote sensor)</text>

<rect x="680" y="90" width="180" height="90" rx="10" fill="#f4f5f9" stroke="#000AB5" stroke-width="3"/>
<text x="770" y="128" font-size="16" font-weight="700" text-anchor="middle">Mechanism</text>
<text x="770" y="150" font-size="13" text-anchor="middle">(the arm)</text>

<!-- arrows -->
<line x1="222" y1="135" x2="356" y2="135" stroke="#000AB5" stroke-width="3" marker-end="url(#arr)"/>
<line x1="542" y1="135" x2="676" y2="135" stroke="#000AB5" stroke-width="3" marker-end="url(#arr)"/>
<text x="289" y="122" font-size="14" text-anchor="middle">45:1 gearbox</text>
<text x="609" y="122" font-size="14" text-anchor="middle">48T / 16T chain</text>

<!-- ratio braces -->
<path d="M130,200 v14 H450 v-14" fill="none" stroke="#16181d" stroke-width="2"/>
<text x="290" y="240" font-size="16" font-weight="700" text-anchor="middle">RotorToSensorRatio = 45</text>
<text x="290" y="262" font-size="14" text-anchor="middle">motor turns per CANcoder turn</text>

<path d="M450,200 v14 H770 v-14" fill="none" stroke="#16181d" stroke-width="2"/>
<text x="610" y="240" font-size="16" font-weight="700" text-anchor="middle">SensorToMechanismRatio = 3</text>
<text x="610" y="262" font-size="14" text-anchor="middle">CANcoder turns per arm turn</text>

<path d="M130,285 v14 H770 v-14" fill="none" stroke="#c9ced8" stroke-width="2"/>
<text x="450" y="322" font-size="14" text-anchor="middle">Total motor to arm = 45 x 3 = 135 (the Talon works this out; you never type 135)</text>

<!-- check box -->
<rect x="40" y="345" width="820" height="110" rx="8" fill="#f4f5f9" stroke="#c9ced8"/>
<text x="60" y="372" font-size="15" font-weight="700">Check it by hand (robot disabled, motor in coast):</text>
<text x="60" y="396" font-size="14">Turn the arm one quarter turn. The CANcoder should read 0.75 rotations of change, the motor rotor about 33.75,</text>
<text x="60" y="418" font-size="14">and the Talon's getPosition() 0.25. If getPosition() says 2.25, SensorToMechanismRatio is upside down (1/3, not 3).</text>
<text x="60" y="440" font-size="14">This arm only swings 100° (0.28 turn), so the CANcoder turns 0.83 turn: still under one, still absolute.</text>
</g>
</svg>
