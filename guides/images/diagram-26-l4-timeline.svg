<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" font-family="Inter, Arial, sans-serif">
  <rect width="860" height="500" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#16181d">A safe move from L2 to L4 (holding coral), step by step</text>

  <!-- phase band -->
  <rect x="150" y="50" width="123.75" height="40" fill="#FFA700"/>
  <rect x="273.75" y="50" width="330" height="40" fill="#000AB5"/>
  <rect x="603.75" y="50" width="123.75" height="40" fill="#FFA700"/>
  <rect x="727.5" y="50" width="82.5" height="40" fill="#f4f5f9" stroke="#c9ced8"/>
  <text x="211.9" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#16181d">TUCKING</text>
  <text x="438.75" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">MOVING_ELEVATOR</text>
  <text x="665.6" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#16181d">EXTENDING</text>
  <text x="768.75" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#16181d">AT_GOAL</text>

  <!-- phase boundary lines -->
  <g stroke="#c9ced8" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="273.75" y1="90" x2="273.75" y2="410"/>
    <line x1="603.75" y1="90" x2="603.75" y2="410"/>
    <line x1="727.5" y1="90" x2="727.5" y2="410"/>
  </g>

  <!-- lane labels and boxes -->
  <g font-size="15" font-weight="700" fill="#16181d">
    <text x="20" y="150">Arm</text>
    <text x="20" y="250">Elevator</text>
    <text x="20" y="350">Wrist</text>
  </g>
  <g font-size="13" fill="#16181d">
    <text x="20" y="168">(degrees)</text>
    <text x="20" y="268">(inches)</text>
    <text x="20" y="368">(degrees)</text>
  </g>
  <g fill="none" stroke="#c9ced8" stroke-width="1">
    <rect x="150" y="110" width="660" height="90"/>
    <rect x="150" y="210" width="660" height="90"/>
    <rect x="150" y="310" width="660" height="90"/>
  </g>

  <!-- arm: 35 -> 90 (tucked) -> hold -> 60 -->
  <path d="M150,188.8 C200,188.8 225,121.2 273.75,121.2 L603.75,121.2 C650,121.2 680,158.1 727.5,158.1 L810,158.1" fill="none" stroke="#000AB5" stroke-width="3.5"/>
  <text x="155" y="182" font-size="13" fill="#16181d">35</text>
  <text x="430" y="138" font-size="13" fill="#16181d" text-anchor="middle">90 = straight up (tucked, safe)</text>
  <text x="768" y="150" font-size="13" fill="#16181d" text-anchor="middle">60</text>

  <!-- elevator: 14 -> 52 -->
  <path d="M150,274.6 L273.75,274.6 C380,274.6 500,219.4 603.75,219.4 L810,219.4" fill="none" stroke="#000AB5" stroke-width="3.5"/>
  <text x="155" y="268" font-size="13" fill="#16181d">14</text>
  <text x="700" y="238" font-size="13" fill="#16181d" text-anchor="middle">52 (L4)</text>

  <!-- wrist: -20 -> 0 -> hold -> -40 -->
  <path d="M150,355 C200,355 225,323 273.75,323 L603.75,323 C650,323 680,387 727.5,387 L810,387" fill="none" stroke="#000AB5" stroke-width="3.5"/>
  <text x="155" y="349" font-size="13" fill="#16181d">-20</text>
  <text x="430" y="340" font-size="13" fill="#16181d" text-anchor="middle">0 = in line with the arm</text>
  <text x="768" y="380" font-size="13" fill="#16181d" text-anchor="middle">-40</text>

  <!-- time axis -->
  <line x1="150" y1="410" x2="810" y2="410" stroke="#16181d" stroke-width="1.5"/>
  <g font-size="13" fill="#16181d" text-anchor="middle">
    <text x="150" y="428">0 s</text>
    <text x="273.75" y="428">0.3 s</text>
    <text x="603.75" y="428">1.1 s</text>
    <text x="727.5" y="428">1.4 s</text>
  </g>
  <text x="150" y="452" font-size="13" fill="#16181d">Operator presses L4: wanted = L4</text>
  <text x="810" y="452" font-size="13" fill="#16181d" text-anchor="end">isAtGoal(L4) true: driver can score</text>
  <text x="430" y="482" text-anchor="middle" font-size="13" fill="#16181d">Each phase ends when its joints are within tolerance (or its timeout fires). Times are an example.</text>
</svg>
