<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000AB5"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b97a00"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16181d"/>
    </marker>
  </defs>

  <!-- panel divider -->
  <line x1="480" y1="20" x2="480" y2="580" stroke="#c9ced8" stroke-width="1.5"/>

  <!-- ===================== PANEL A: camera on turret, tx servo ===================== -->
  <text x="240" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#000AB5">Way 1: camera on the turret</text>
  <text x="240" y="54" text-anchor="middle" font-size="13" fill="#16181d">close the loop on Limelight tx</text>

  <!-- robot -->
  <rect x="100" y="220" width="160" height="160" rx="10" fill="#f4f5f9" stroke="#000AB5" stroke-width="3"/>
  <text x="180" y="214" text-anchor="middle" font-size="12" fill="#16181d">robot</text>

  <!-- camera label with leader line, kept well clear of the turret -->
  <text x="320" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#16181d">camera</text>
  <text x="320" y="124" text-anchor="middle" font-size="11" fill="#16181d">(mounted ON the turret,</text>
  <text x="320" y="137" text-anchor="middle" font-size="11" fill="#16181d">turns with it)</text>
  <line x1="300" y1="145" x2="215" y2="248" stroke="#16181d" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- turret + camera riding on it -->
  <circle cx="180" cy="300" r="20" fill="none" stroke="#000AB5" stroke-width="3"/>
  <circle cx="180" cy="300" r="5" fill="#000AB5"/>
  <rect x="193" y="283" width="24" height="15" rx="2" fill="#16181d" transform="rotate(-32 205 290)"/>

  <!-- boresight (where the turret currently points) and line of sight to the real target -->
  <line x1="180" y1="300" x2="330" y2="205" stroke="#16181d" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="180" y1="300" x2="415" y2="300" stroke="#b97a00" stroke-width="3" marker-end="url(#arrG)"/>
  <circle cx="428" cy="300" r="14" fill="#FFA700" stroke="#b97a00" stroke-width="2"/>
  <text x="428" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#16181d">target</text>

  <!-- tx angle arc between boresight and line of sight -->
  <path d="M226.4,272.9 A55,55 0 0,1 235,300" fill="none" stroke="#16181d" stroke-width="2"/>
  <text x="252" y="278" font-size="15" font-weight="700" fill="#16181d">tx</text>

  <!-- turn arrow closing tx -->
  <path d="M180,340 A40,40 0 0,0 211,325" fill="none" stroke="#000AB5" stroke-width="2.5" marker-end="url(#arrB)"/>
  <text x="130" y="400" font-size="12" fill="#000AB5">turret turns until</text>
  <text x="130" y="416" font-size="12" fill="#000AB5">tx reads 0</text>

  <rect x="75" y="440" width="330" height="36" rx="5" fill="#eef0fb" stroke="#000AB5" stroke-width="1.2"/>
  <text x="240" y="463" text-anchor="middle" font-size="12.5" font-family="JetBrains Mono, monospace" fill="#000AB5">turret += -kP * tx   (only while tv is true)</text>

  <text x="240" y="505" text-anchor="middle" font-size="13" fill="#16181d">Needs to see the target right now.</text>
  <text x="240" y="524" text-anchor="middle" font-size="13" fill="#16181d">No target visible = nothing to steer with.</text>
  <text x="240" y="543" text-anchor="middle" font-size="13" fill="#16181d">Robot motion isn't accounted for, so a</text>
  <text x="240" y="562" text-anchor="middle" font-size="13" fill="#16181d">moving shot has no way to lead the target.</text>
  <text x="240" y="594" text-anchor="middle" font-size="13" font-weight="700" fill="#16181d">Good for: standing-still shots.</text>

  <!-- ===================== PANEL B: pose-only field math ===================== -->
  <text x="720" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#000AB5">Way 2: pose-only (field math)</text>
  <text x="720" y="54" text-anchor="middle" font-size="13" fill="#16181d">what Turret.java actually does</text>

  <!-- robot -->
  <rect x="640" y="220" width="160" height="160" rx="10" fill="#f4f5f9" stroke="#000AB5" stroke-width="3"/>
  <text x="720" y="214" text-anchor="middle" font-size="12" fill="#16181d">robot (pose x, y, heading)</text>

  <!-- fixed camera elsewhere on the chassis, looking at an unrelated tag -->
  <text x="605" y="92" text-anchor="middle" font-size="11" fill="#16181d">AprilTag, anywhere</text>
  <text x="605" y="106" text-anchor="middle" font-size="11" fill="#16181d">(just corrects the pose)</text>
  <rect x="649" y="229" width="22" height="14" rx="2" fill="#16181d"/>
  <line x1="660" y1="236" x2="605" y2="150" stroke="#16181d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="591" y="150" width="18" height="18" fill="none" stroke="#16181d" stroke-width="2"/>

  <!-- turret, pointed away from the target (blind spot!) -->
  <circle cx="720" cy="300" r="20" fill="none" stroke="#000AB5" stroke-width="3"/>
  <circle cx="720" cy="300" r="5" fill="#000AB5"/>

  <!-- vector from turret to target, computed not seen; target off to the side, outside camera view -->
  <line x1="720" y1="300" x2="878" y2="355" stroke="#000AB5" stroke-width="3" stroke-dasharray="2 5" marker-end="url(#arrB)"/>
  <text x="795" y="314" font-size="13" font-weight="700" fill="#000AB5">computed</text>
  <text x="795" y="330" font-size="13" font-weight="700" fill="#000AB5">vector</text>
  <circle cx="890" cy="360" r="14" fill="#FFA700" stroke="#b97a00" stroke-width="2"/>
  <text x="890" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#16181d">target</text>
  <text x="890" y="405" text-anchor="middle" font-size="10.5" fill="#16181d">(no camera on it)</text>

  <rect x="615" y="440" width="210" height="58" rx="5" fill="#eef0fb" stroke="#000AB5" stroke-width="1.2"/>
  <text x="720" y="460" text-anchor="middle" font-size="11" font-family="JetBrains Mono, monospace" fill="#000AB5">angle = atan2(target - turretPos)</text>
  <text x="720" y="476" text-anchor="middle" font-size="11" font-family="JetBrains Mono, monospace" fill="#000AB5">- heading - zeroOffset</text>
  <text x="720" y="492" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono, monospace" fill="#b97a00">(+ velocity x flight time for SOTM)</text>

  <text x="720" y="524" text-anchor="middle" font-size="13" fill="#16181d">Aims from field geometry, not pixels, so it</text>
  <text x="720" y="543" text-anchor="middle" font-size="13" fill="#16181d">works even for a tag-free target, or one</text>
  <text x="720" y="562" text-anchor="middle" font-size="13" fill="#16181d">sitting in the turret's own blind spot.</text>
  <text x="720" y="594" text-anchor="middle" font-size="13" font-weight="700" fill="#16181d">Good for: shoot-on-the-move.</text>

  <text x="480" y="625" text-anchor="middle" font-size="12" fill="#16181d">Both read the same field pose estimate; they differ in what feeds the turret's angle: a live camera pixel (Way 1) or field math (Way 2).</text>
</svg>
