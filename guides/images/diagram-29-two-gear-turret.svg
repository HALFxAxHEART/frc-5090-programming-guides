<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
<rect width="900" height="560" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" fill="#16181d">
<text x="450" y="30" font-size="19" font-weight="700" text-anchor="middle">A turret with two CRT encoders (top view, gears not to scale)</text>

<!-- ring gear -->
<circle cx="260" cy="290" r="170" fill="#f4f5f9" stroke="#000AB5" stroke-width="10" stroke-dasharray="4 4"/>
<circle cx="260" cy="290" r="150" fill="#ffffff" stroke="#c9ced8" stroke-width="2"/>
<text x="260" y="270" font-size="17" font-weight="700" text-anchor="middle">Turret ring</text>
<text x="260" y="292" font-size="15" text-anchor="middle">200 teeth</text>
<text x="260" y="314" font-size="13" text-anchor="middle">(hollow middle: wires and</text>
<text x="260" y="331" font-size="13" text-anchor="middle">balls pass through, so no</text>
<text x="260" y="348" font-size="13" text-anchor="middle">center shaft for a sensor)</text>

<!-- pinion A (19T) -->
<circle cx="416" cy="159" r="34" fill="#ffffff" stroke="#16181d" stroke-width="7" stroke-dasharray="3 3"/>
<circle cx="416" cy="159" r="18" fill="#FFA700" stroke="#16181d" stroke-width="1.5"/>
<text x="416" y="165" font-size="15" font-weight="700" text-anchor="middle">A</text>
<text x="458" y="120" font-size="14" font-weight="700">Encoder A on a 19T pinion</text>
<text x="458" y="138" font-size="13">turns 200/19 = 10.53x per turret turn</text>

<!-- pinion B (23T) -->
<circle cx="421" cy="425" r="40" fill="#ffffff" stroke="#16181d" stroke-width="7" stroke-dasharray="3 3"/>
<circle cx="421" cy="425" r="18" fill="#FFA700" stroke="#16181d" stroke-width="1.5"/>
<text x="421" y="431" font-size="15" font-weight="700" text-anchor="middle">B</text>
<text x="470" y="438" font-size="14" font-weight="700">Encoder B on a 23T pinion</text>
<text x="470" y="456" font-size="13">turns 200/23 = 8.70x per turret turn</text>

<!-- motor pinion 16T -->
<circle cx="260" cy="490" r="30" fill="#000AB5" stroke="#16181d" stroke-width="7" stroke-dasharray="3 3"/>
<text x="260" y="496" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">M</text>
<text x="300" y="530" font-size="13">Minion motor (Talon FXS 16), 16T pinion: 12.5 : 1</text>

<!-- info panel -->
<rect x="520" y="175" width="360" height="225" rx="8" fill="#f4f5f9" stroke="#c9ced8"/>
<text x="540" y="202" font-size="14">Each encoder alone repeats every</text>
<text x="540" y="222" font-size="14"><tspan font-weight="700">19</tspan> (or <tspan font-weight="700">23</tspan>) teeth of the ring.</text>
<text x="540" y="252" font-size="14">19 and 23 share no factor, so the</text>
<text x="540" y="272" font-size="14">pair repeats only every</text>
<text x="540" y="296" font-size="16" font-weight="700" fill="#000AB5">19 x 23 = 437 ring teeth</text>
<text x="540" y="318" font-size="16" font-weight="700" fill="#000AB5">= 437 / 200 = 2.185 turret turns</text>
<text x="540" y="348" font-size="14">Our turret only needs ±108° =</text>
<text x="540" y="368" font-size="14">0.6 turn = 120 teeth. Plenty of room.</text>
</g>
</svg>
