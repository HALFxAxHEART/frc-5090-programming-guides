<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000AB5"/>
    </marker>
    <marker id="garr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFA700"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="700" fill="#16181d">What a wrong camera setting looks like (robot sitting still, top view)</text>

  <!-- legend -->
  <rect x="20" y="44" width="22" height="22" fill="#f4f5f9" stroke="#000AB5" stroke-width="2.5"/>
  <text x="50" y="60" font-size="13" fill="#16181d">where the robot really is (tape measure)</text>
  <rect x="330" y="44" width="22" height="22" fill="none" stroke="#FFA700" stroke-width="3" stroke-dasharray="5 3"/>
  <text x="360" y="60" font-size="13" fill="#16181d">Poses/Vision (what the camera says)</text>
  <rect x="640" y="47" width="8" height="16" fill="#16181d"/>
  <text x="656" y="60" font-size="13" fill="#16181d">AprilTag on a wall</text>

  <!-- panel frames -->
  <rect x="20" y="80" width="200" height="210" rx="8" fill="#ffffff" stroke="#c9ced8" stroke-width="2"/>
  <rect x="235" y="80" width="200" height="210" rx="8" fill="#ffffff" stroke="#c9ced8" stroke-width="2"/>
  <rect x="450" y="80" width="200" height="210" rx="8" fill="#ffffff" stroke="#c9ced8" stroke-width="2"/>
  <rect x="665" y="80" width="200" height="210" rx="8" fill="#ffffff" stroke="#c9ced8" stroke-width="2"/>

  <!-- panel 1: good -->
  <rect x="30" y="90" width="6" height="190" fill="#c9ced8"/>
  <rect x="36" y="177" width="8" height="16" fill="#16181d"/>
  <rect x="120" y="160" width="50" height="50" fill="#f4f5f9" stroke="#000AB5" stroke-width="2.5"/>
  <line x1="120" y1="185" x2="98" y2="185" stroke="#000AB5" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="123" y="162" width="50" height="50" fill="none" stroke="#FFA700" stroke-width="3" stroke-dasharray="5 3"/>

  <!-- panel 2: side sign flipped -->
  <rect x="245" y="90" width="6" height="190" fill="#c9ced8"/>
  <rect x="251" y="177" width="8" height="16" fill="#16181d"/>
  <rect x="335" y="185" width="50" height="50" fill="#f4f5f9" stroke="#000AB5" stroke-width="2.5"/>
  <line x1="335" y1="210" x2="313" y2="210" stroke="#000AB5" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="335" y="110" width="50" height="50" fill="none" stroke="#FFA700" stroke-width="3" stroke-dasharray="5 3"/>
  <line x1="395" y1="212" x2="395" y2="137" stroke="#16181d" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="400" y="178" font-size="13" fill="#16181d">2x</text>
  <text x="400" y="194" font-size="13" fill="#16181d">side</text>

  <!-- panel 3: yaw wrong -->
  <rect x="460" y="90" width="6" height="190" fill="#c9ced8"/>
  <rect x="466" y="177" width="8" height="16" fill="#16181d"/>
  <rect x="520" y="160" width="50" height="50" fill="#f4f5f9" stroke="#000AB5" stroke-width="2.5"/>
  <line x1="520" y1="185" x2="498" y2="185" stroke="#000AB5" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="585" y="160" width="50" height="50" fill="none" stroke="#FFA700" stroke-width="3" stroke-dasharray="5 3"/>
  <line x1="635" y1="185" x2="645" y2="185" stroke="#FFA700" stroke-width="2.5" marker-end="url(#garr)"/>
  <text x="560" y="240" text-anchor="middle" font-size="13" fill="#16181d">ghost faces the</text>
  <text x="560" y="256" text-anchor="middle" font-size="13" fill="#16181d">wrong way</text>

  <!-- panel 4: height / pitch wrong -->
  <rect x="675" y="90" width="6" height="190" fill="#c9ced8"/>
  <rect x="681" y="177" width="8" height="16" fill="#16181d"/>
  <rect x="735" y="160" width="50" height="50" fill="#f4f5f9" stroke="#000AB5" stroke-width="2.5"/>
  <line x1="735" y1="185" x2="713" y2="185" stroke="#000AB5" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="790" y="160" width="50" height="50" fill="none" stroke="#FFA700" stroke-width="3" stroke-dasharray="5 3"/>
  <text x="765" y="240" text-anchor="middle" font-size="13" fill="#16181d">ghost too far (or too</text>
  <text x="765" y="256" text-anchor="middle" font-size="13" fill="#16181d">close) from the tag</text>

  <!-- captions -->
  <text x="120" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#000AB5">1. Good</text>
  <text x="120" y="332" text-anchor="middle" font-size="13" fill="#16181d">within a few cm,</text>
  <text x="120" y="350" text-anchor="middle" font-size="13" fill="#16181d">same heading</text>

  <text x="335" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#000AB5">2. Side sign flipped</text>
  <text x="335" y="332" text-anchor="middle" font-size="13" fill="#16181d">shifted sideways by twice</text>
  <text x="335" y="350" text-anchor="middle" font-size="13" fill="#16181d">the camera's side offset</text>

  <text x="550" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#000AB5">3. Yaw wrong</text>
  <text x="550" y="332" text-anchor="middle" font-size="13" fill="#16181d">turned around or "mirrored";</text>
  <text x="550" y="350" text-anchor="middle" font-size="13" fill="#16181d">often camera faces back, yaw 0</text>

  <text x="765" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#000AB5">4. Height / pitch wrong</text>
  <text x="765" y="332" text-anchor="middle" font-size="13" fill="#16181d">error grows the further</text>
  <text x="765" y="350" text-anchor="middle" font-size="13" fill="#16181d">you are from the tag</text>

  <text x="20" y="385" font-size="13" fill="#16181d">Not shown: wrong field map (Welded vs AndyMark) gives small errors of a few cm, only near some tags.</text>
</svg>
