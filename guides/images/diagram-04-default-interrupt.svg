<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16181d"/>
    </marker>
  </defs>
  <rect width="860" height="330" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#16181d">Who owns the turret? (press and release B)</text>

  <!-- row labels -->
  <text x="20" y="92" font-size="16" font-weight="700" fill="#16181d">B button</text>
  <text x="20" y="182" font-size="16" font-weight="700" fill="#16181d">Turret</text>
  <text x="20" y="202" font-size="13" fill="#16181d">(running command)</text>

  <!-- B signal -->
  <polyline points="170,100 360,100 360,70 600,70 600,100 840,100" fill="none" stroke="#000AB5" stroke-width="3"/>
  <text x="265" y="92" text-anchor="middle" font-size="13" fill="#16181d">released</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#16181d">held</text>
  <text x="720" y="92" text-anchor="middle" font-size="13" fill="#16181d">released</text>

  <!-- turret owners -->
  <rect x="170" y="160" width="190" height="50" rx="6" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/>
  <text x="265" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#16181d">default command</text>
  <text x="265" y="200" text-anchor="middle" font-size="13" fill="#16181d">aim (passOrShoot)</text>

  <rect x="360" y="160" width="240" height="50" rx="6" fill="#FFA700" stroke="#16181d" stroke-width="1.5"/>
  <text x="480" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#16181d">failsafeShoot()</text>
  <text x="480" y="200" text-anchor="middle" font-size="13" fill="#16181d">turret.run(goToZero)</text>

  <rect x="600" y="160" width="240" height="50" rx="6" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/>
  <text x="720" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#16181d">default command</text>
  <text x="720" y="200" text-anchor="middle" font-size="13" fill="#16181d">aim again (new initialize())</text>

  <!-- events -->
  <line x1="360" y1="110" x2="360" y2="255" stroke="#16181d" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="600" y1="110" x2="600" y2="255" stroke="#16181d" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="352" y="250" text-anchor="end" font-size="13" fill="#16181d">needs the turret, so</text>
  <text x="352" y="268" text-anchor="end" font-size="13" fill="#16181d">aim gets end(true),</text>
  <text x="352" y="286" text-anchor="end" font-size="13" fill="#16181d">then failsafe initialize()</text>
  <text x="608" y="250" font-size="13" fill="#16181d">whileTrue cancels failsafe: end(true).</text>
  <text x="608" y="268" font-size="13" fill="#16181d">Turret is free, so scheduler step 4</text>
  <text x="608" y="286" font-size="13" fill="#16181d">restarts the default command</text>

  <text x="430" y="318" text-anchor="middle" font-size="14" fill="#16181d">Only one command owns a subsystem at a time. Nobody wrote code to "turn aiming back on".</text>
</svg>
