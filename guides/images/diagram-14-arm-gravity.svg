<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000AB5"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16181d"/>
    </marker>
  </defs>

  <!-- ===== Left panel: side view ===== -->
  <text x="190" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">Side view ("forward" to the right)</text>
  <!-- ghost: vertical and horizontal -->
  <line x1="120" y1="300" x2="120" y2="90" stroke="#c9ced8" stroke-width="10" stroke-linecap="round"/>
  <text x="128" y="86" font-size="13" fill="#16181d">90°: cos = 0, no twist</text>
  <line x1="120" y1="300" x2="330" y2="300" stroke="#c9ced8" stroke-width="10" stroke-linecap="round"/>
  <text x="338" y="296" font-size="13" fill="#16181d">0°: cos = 1,</text>
  <text x="338" y="312" font-size="13" fill="#16181d">most twist</text>

  <!-- arm at 40 deg, length 210: end (280.9,165.0); COM at r=130: (219.6,216.4) -->
  <line x1="120" y1="300" x2="280.9" y2="165.0" stroke="#000AB5" stroke-width="12" stroke-linecap="round"/>
  <circle cx="120" cy="300" r="12" fill="#ffffff" stroke="#16181d" stroke-width="3"/>
  <text x="108" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#16181d">pivot</text>

  <!-- angle arc -->
  <path d="M175,300 A55,55 0 0,0 162.1,264.6" fill="none" stroke="#FFA700" stroke-width="3"/>
  <text x="182" y="282" font-size="15" font-weight="700" fill="#16181d">θ</text>

  <!-- center of mass and weight -->
  <circle cx="219.6" cy="216.4" r="9" fill="#FFA700" stroke="#16181d" stroke-width="2"/>
  <text x="196" y="208" text-anchor="end" font-size="13" fill="#16181d">center of mass</text>
  <line x1="219.6" y1="226" x2="219.6" y2="290" stroke="#16181d" stroke-width="3" marker-end="url(#arrK)"/>
  <text x="228" y="262" font-size="13" font-weight="700" fill="#16181d">weight m·g</text>

  <!-- lever arm dimension -->
  <line x1="120" y1="360" x2="219.6" y2="360" stroke="#000AB5" stroke-width="2.5" marker-start="url(#arrB)" marker-end="url(#arrB)"/>
  <line x1="219.6" y1="300" x2="219.6" y2="368" stroke="#000AB5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="170" y="384" text-anchor="middle" font-size="14" font-weight="700" fill="#000AB5">r · cos(θ)</text>
  <text x="170" y="402" text-anchor="middle" font-size="13" fill="#16181d">sideways distance = lever arm</text>
  <text x="190" y="428" text-anchor="middle" font-size="13" fill="#16181d">torque = m · g · r · cos(θ)</text>

  <!-- ===== Right panel: graph ===== -->
  <text x="620" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">holding volts = kG · cos(θ), kG = 0.35 V</text>
  <!-- grid / axes: theta -90..180 -> x 440..800; V +-0.35 -> y 130..330, zero at 230 -->
  <line x1="440" y1="130" x2="800" y2="130" stroke="#c9ced8" stroke-dasharray="4 4"/>
  <line x1="440" y1="330" x2="800" y2="330" stroke="#c9ced8" stroke-dasharray="4 4"/>
  <line x1="680" y1="110" x2="680" y2="345" stroke="#c9ced8" stroke-dasharray="4 4"/>
  <line x1="440" y1="230" x2="815" y2="230" stroke="#16181d" stroke-width="2" marker-end="url(#arrK)"/>
  <line x1="560" y1="350" x2="560" y2="85" stroke="#16181d" stroke-width="2" marker-end="url(#arrK)"/>
  <!-- negative region shading -->
  <rect x="680" y="230" width="120" height="100" fill="#f4f5f9"/>
  <polyline fill="none" stroke="#000AB5" stroke-width="4" points="440.0,230.0 446.7,221.3 453.3,212.6 460.0,204.1 466.7,195.8 473.3,187.7 480.0,180.0 486.7,172.6 493.3,165.7 500.0,159.3 506.7,153.4 513.3,148.1 520.0,143.4 526.7,139.4 533.3,136.0 540.0,133.4 546.7,131.5 553.3,130.4 560.0,130.0 566.7,130.4 573.3,131.5 580.0,133.4 586.7,136.0 593.3,139.4 600.0,143.4 606.7,148.1 613.3,153.4 620.0,159.3 626.7,165.7 633.3,172.6 640.0,180.0 646.7,187.7 653.3,195.8 660.0,204.1 666.7,212.6 673.3,221.3 680.0,230.0 686.7,238.7 693.3,247.4 700.0,255.9 706.7,264.2 713.3,272.3 720.0,280.0 726.7,287.4 733.3,294.3 740.0,300.7 746.7,306.6 753.3,311.9 760.0,316.6 766.7,320.6 773.3,324.0 780.0,326.6 786.7,328.5 793.3,329.6 800.0,330.0"/>
  <circle cx="560" cy="130" r="6" fill="#FFA700" stroke="#16181d" stroke-width="1.5"/>
  <circle cx="680" cy="230" r="6" fill="#FFA700" stroke="#16181d" stroke-width="1.5"/>

  <!-- tick labels -->
  <text x="440" y="252" text-anchor="middle" font-size="13" fill="#16181d">-90°</text>
  <text x="572" y="252" font-size="13" fill="#16181d">0°</text>
  <text x="688" y="222" font-size="13" fill="#16181d">90°</text>
  <text x="800" y="252" text-anchor="middle" font-size="13" fill="#16181d" dy="-32">180°</text>
  <text x="552" y="126" text-anchor="end" font-size="13" fill="#16181d">+0.35 V</text>
  <text x="552" y="334" text-anchor="end" font-size="13" fill="#16181d">-0.35 V</text>
  <text x="815" y="250" text-anchor="end" font-size="13" fill="#16181d" dy="105">θ (from horizontal)</text>

  <!-- annotations -->
  <text x="590" y="112" font-size="13" fill="#16181d">level: needs the full kG</text>
  <text x="440" y="380" font-size="13" fill="#16181d">straight up (90°): needs 0 V.</text>
  <text x="440" y="398" font-size="13" fill="#16181d">Past vertical (gray box) the voltage goes negative:</text>
  <text x="440" y="416" font-size="13" fill="#16181d">the motor holds the arm back the other way.</text>
</svg>
