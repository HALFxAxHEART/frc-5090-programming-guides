<text x="869.0" y="136" font-size="17" font-weight="400" fill="#9aa0ab" text-anchor="middle">0</text>
<line x1="20" y1="198" x2="893" y2="198" stroke="#c9ced8"/>
<text x="20" y="181" font-size="14" font-weight="700">remainder ÷ 5</text>
<text x="149.0" y="182" font-size="17" font-weight="400" fill="#000AB5" text-anchor="middle">0</text>
<text x="197.0" y="182" font-size="17" font-weight="400" fill="#000AB5" text-anchor="middle">1</text>
