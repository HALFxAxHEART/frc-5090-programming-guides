<line x1="845" y1="60" x2="845" y2="198" stroke="#16181d" stroke-dasharray="4 3"/>
<text x="533.0" y="226" font-size="14" font-weight="700" text-anchor="middle">8 is the only n</text>
<text x="533.0" y="244" font-size="14" text-anchor="middle">with remainders (2, 3)</text>
<text x="884" y="226" font-size="13" text-anchor="end">15 = (0, 0)</text>
<text x="884" y="244" font-size="13" text-anchor="end">same as 0:</text>
<text x="884" y="262" font-size="13" text-anchor="end">it repeats</text>
<rect x="20" y="288" width="860" height="92" rx="8" fill="#f4f5f9" stroke="#c9ced8"/>
<text x="40" y="314" font-size="14">The ÷3 row repeats every 3, the ÷5 row every 5. Together they line up again only at 3 x 5 = 15.</text>
<text x="40" y="338" font-size="14">So within 0 to 14 the two remainders work like a unique ID for n. On a turret, "n" is how many ring</text>
<text x="40" y="362" font-size="14">teeth have gone by, and the two encoders are the two remainders (by 19 and by 23 instead of 3 and 5).</text>
</g></svg>