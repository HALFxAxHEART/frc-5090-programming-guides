<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Inter, Arial, sans-serif" fill="#16181d">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000AB5"/></marker></defs>
<rect width="900" height="470" fill="#fff"/>
<text x="450.0" y="30" text-anchor="middle" font-size="20" font-weight="700">The test ladder: climb one step at a time</text>
<rect x="22" y="140" width="206" height="300" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/>
<rect x="22" y="140" width="206" height="58" rx="8" fill="#000AB5"/>
<rect x="22" y="180" width="206" height="18" fill="#000AB5"/>
<text x="125.0" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1. Sim</text>
<text x="125.0" y="187" text-anchor="middle" font-size="13" fill="#fff">Laptop only</text>
<text x="34" y="222" font-size="13" font-weight="700" fill="#000AB5">CHECK</text>
<text x="34" y="241" font-size="13">Code runs, commands</text>
<text x="34" y="259" font-size="13">start and stop,</text>
<text x="34" y="277" font-size="13">directions and limits</text>
<text x="34" y="295" font-size="13">make sense</text>
<text x="34" y="327" font-size="13" font-weight="700" fill="#c07d00">MOVE ON WHEN</text>
<text x="34" y="346" font-size="13">Correct in sim, both</text>
<text x="34" y="364" font-size="13">alliances if it matters</text>
<text x="125.0" y="417" text-anchor="middle" font-size="13" font-style="italic">Proves the logic</text>
<rect x="236" y="110" width="206" height="330" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/>
<rect x="236" y="110" width="206" height="58" rx="8" fill="#000AB5"/>
<rect x="236" y="150" width="206" height="18" fill="#000AB5"/>
<text x="339.0" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2. On blocks</text>
<text x="339.0" y="157" text-anchor="middle" font-size="13" fill="#fff">Wheels off the ground</text>
<text x="248" y="192" font-size="13" font-weight="700" fill="#000AB5">CHECK</text>
<text x="248" y="211" font-size="13">Motor direction,</text>
<text x="248" y="229" font-size="13">sensors (push it by</text>
<text x="248" y="247" font-size="13">hand), current limits,</text>
<text x="248" y="265" font-size="13">soft limits, homing</text>
<text x="248" y="297" font-size="13" font-weight="700" fill="#c07d00">MOVE ON WHEN</text>
<text x="248" y="316" font-size="13">Every direction right,</text>
<text x="248" y="334" font-size="13">stops where it should</text>
<text x="248" y="352" font-size="13">at low output</text>
<rect x="246" y="396" width="186" height="32" rx="6" fill="#fff" stroke="#FFA700" stroke-width="2"/>
<text x="339.0" y="417" text-anchor="middle" font-size="13" font-weight="700">Someone on the disable key</text>
<rect x="450" y="80" width="206" height="360" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/>
<rect x="450" y="80" width="206" height="58" rx="8" fill="#000AB5"/>
<rect x="450" y="120" width="206" height="18" fill="#000AB5"/>
<text x="553.0" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3. Slow on the floor</text>
<text x="553.0" y="127" text-anchor="middle" font-size="13" fill="#fff">Clear area, speeds way down</text>
<text x="462" y="162" font-size="13" font-weight="700" fill="#000AB5">CHECK</text>
<text x="462" y="181" font-size="13">The whole system:</text>
<text x="462" y="199" font-size="13">driving, paths,</text>
<text x="462" y="217" font-size="13">aiming, intake on</text>
<text x="462" y="235" font-size="13">the floor</text>
<text x="462" y="267" font-size="13" font-weight="700" fill="#c07d00">MOVE ON WHEN</text>
<text x="462" y="286" font-size="13">Does the right thing,</text>
<text x="462" y="304" font-size="13">slowly, three times</text>
<text x="462" y="322" font-size="13">in a row</text>
<rect x="460" y="396" width="186" height="32" rx="6" fill="#fff" stroke="#FFA700" stroke-width="2"/>
<text x="553.0" y="417" text-anchor="middle" font-size="13" font-weight="700">Someone on the disable key</text>
<rect x="664" y="50" width="206" height="390" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/>
<rect x="664" y="50" width="206" height="58" rx="8" fill="#000AB5"/>
<rect x="664" y="90" width="206" height="18" fill="#000AB5"/>
<text x="767.0" y="76" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4. Full speed</text>
<text x="767.0" y="97" text-anchor="middle" font-size="13" fill="#fff">Raise speeds in steps</text>
<text x="676" y="132" font-size="13" font-weight="700" fill="#000AB5">CHECK</text>
<text x="676" y="151" font-size="13">Tuning, timing,</text>
<text x="676" y="169" font-size="13">cycle time,</text>
<text x="676" y="187" font-size="13">driver feel</text>
<text x="676" y="219" font-size="13" font-weight="700" fill="#c07d00">DONE WHEN</text>
<text x="676" y="238" font-size="13">Drivers are happy</text>
<text x="676" y="256" font-size="13">and the logs</text>
<text x="676" y="274" font-size="13">look clean</text>
<rect x="674" y="396" width="186" height="32" rx="6" fill="#fff" stroke="#FFA700" stroke-width="2"/>
<text x="767.0" y="417" text-anchor="middle" font-size="13" font-weight="700">Someone on the disable key</text>
<text x="450.0" y="462" text-anchor="middle" font-size="13">Don't skip a step because the last one went well. Sim proves the logic; only the robot proves the physics.</text>
</svg>