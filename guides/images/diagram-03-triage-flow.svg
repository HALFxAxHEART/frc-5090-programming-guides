<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="Inter, Arial, sans-serif" fill="#16181d">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000AB5"/></marker></defs>
<rect width="880" height="600" fill="#fff"/>
<text x="440.0" y="32" text-anchor="middle" font-size="20" font-weight="700">"The robot did something weird": go in this order</text>
<rect x="20" y="60" width="560" height="62" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/>
<text x="36" y="85" font-size="15" font-weight="700">1  WRITE IT DOWN</text>
<text x="180" y="85" font-size="13">What happened, which match, what time,</text>
<text x="180" y="104" font-size="13">what the driver was doing.</text>
<line x1="290" y1="122" x2="290" y2="149" stroke="#000AB5" stroke-width="3" marker-end="url(#ah)"/>
<rect x="20" y="150" width="560" height="62" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/>
<text x="36" y="175" font-size="15" font-weight="700">2  DS LOG</text>
<text x="180" y="175" font-size="13">Comms lost? roboRIO reboot? radio reboot?</text>
<text x="180" y="194" font-size="13">"No Robot Code"?</text>
<line x1="290" y1="212" x2="290" y2="239" stroke="#000AB5" stroke-width="3" marker-end="url(#ah)"/>
<text x="302" y="231" font-size="13" fill="#555">no</text>
<line x1="580" y1="181.0" x2="609" y2="181.0" stroke="#000AB5" stroke-width="3" marker-end="url(#ah)"/>
<text x="584" y="172.0" font-size="13" font-weight="700">yes</text>
<rect x="610" y="156" width="250" height="50" rx="8" fill="#fff" stroke="#16181d" stroke-width="1.5"/>
<text x="622" y="177" font-size="13" font-weight="700">Network / power hardware.</text>
<text x="622" y="195" font-size="13">See 01 and the table in section 3.</text>
<rect x="20" y="240" width="560" height="62" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/>
<text x="36" y="265" font-size="15" font-weight="700">3  BROWNOUT?</text>
<text x="180" y="265" font-size="13">Voltage dips, Brownout events, 12V fault</text>
<text x="180" y="284" font-size="13">count, driver felt rumble?</text>
<line x1="290" y1="302" x2="290" y2="329" stroke="#000AB5" stroke-width="3" marker-end="url(#ah)"/>
<text x="302" y="321" font-size="13" fill="#555">no</text>
<line x1="580" y1="271.0" x2="609" y2="271.0" stroke="#000AB5" stroke-width="3" marker-end="url(#ah)"/>
<text x="584" y="262.0" font-size="13" font-weight="700">yes</text>
<rect x="610" y="246" width="250" height="50" rx="8" fill="#fff" stroke="#16181d" stroke-width="1.5"/>
<text x="622" y="267" font-size="13" font-weight="700">Battery, connections,</text>
<text x="622" y="285" font-size="13">current limits.</text>
<rect x="20" y="330" width="560" height="62" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/>
<text x="36" y="355" font-size="15" font-weight="700">4  CAN?</text>
<text x="180" y="355" font-size="13">CAN/Power faults, "device not found",</text>
<text x="180" y="374" font-size="13">Tuner X red or missing cards?</text>
<line x1="290" y1="392" x2="290" y2="419" stroke="#000AB5" stroke-width="3" marker-end="url(#ah)"/>
<text x="302" y="411" font-size="13" fill="#555">no</text>
<line x1="580" y1="361.0" x2="609" y2="361.0" stroke="#000AB5" stroke-width="3" marker-end="url(#ah)"/>
<text x="584" y="352.0" font-size="13" font-weight="700">yes</text>
<rect x="610" y="336" width="250" height="50" rx="8" fill="#fff" stroke="#16181d" stroke-width="1.5"/>
<text x="622" y="357" font-size="13" font-weight="700">IDs, bus names, wiring.</text>
<text x="622" y="375" font-size="13">See 02.</text>
<rect x="20" y="420" width="560" height="62" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/>
<text x="36" y="445" font-size="15" font-weight="700">5  OUR LOGS</text>
<text x="180" y="445" font-size="13">USB stick .wpilog + .hoot in AdvantageScope:</text>
<text x="180" y="464" font-size="13">Events, Commands, pose, gyro, vision, currents. See 19.</text>
<line x1="290" y1="482" x2="290" y2="509" stroke="#000AB5" stroke-width="3" marker-end="url(#ah)"/>
<rect x="20" y="510" width="560" height="62" rx="8" fill="#FFA700" stroke="#000AB5" stroke-width="2"/>
<text x="36" y="535" font-size="15" font-weight="700">6  ONLY NOW</text>
<text x="180" y="535" font-size="13">Form a theory, reproduce it on blocks or</text>
<text x="180" y="554" font-size="13">in sim, then change code on a branch.</text>
</svg>