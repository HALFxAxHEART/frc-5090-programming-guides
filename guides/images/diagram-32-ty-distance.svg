<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000AB5"/>
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16181d"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="15" font-weight="700" fill="#16181d">Side view: distance to a game piece on the floor from ty</text>

  <!-- floor -->
  <line x1="20" y1="330" x2="560" y2="330" stroke="#16181d" stroke-width="3"/>
  <text x="440" y="350" font-size="13" fill="#16181d">carpet</text>

  <!-- robot -->
  <rect x="40" y="255" width="150" height="62" rx="6" fill="#f4f5f9" stroke="#000AB5" stroke-width="2.5"/>
  <circle cx="70" cy="320" r="10" fill="#c9ced8" stroke="#16181d"/>
  <circle cx="160" cy="320" r="10" fill="#c9ced8" stroke="#16181d"/>
  <text x="115" y="292" text-anchor="middle" font-size="13" fill="#16181d">robot</text>
  <rect x="112" y="140" width="8" height="115" fill="#c9ced8" stroke="#16181d"/>
  <!-- camera -->
  <g transform="rotate(25 120 130)">
    <rect x="100" y="118" width="34" height="24" rx="3" fill="#000AB5"/>
  </g>
  <circle cx="120" cy="130" r="3.5" fill="#FFA700"/>

  <!-- horizontal reference -->
  <line x1="120" y1="130" x2="540" y2="130" stroke="#c9ced8" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="430" y="122" font-size="13" fill="#16181d">level (0 deg)</text>

  <!-- optical axis / crosshair -->
  <line x1="120" y1="130" x2="520" y2="316.5" stroke="#16181d" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="480" y="248" font-size="13" fill="#16181d">crosshair</text>
  <text x="480" y="264" font-size="13" fill="#16181d">(lens points here)</text>

  <!-- ray to piece -->
  <line x1="120" y1="130" x2="363" y2="300" stroke="#000AB5" stroke-width="3"/>

  <!-- piece -->
  <circle cx="363" cy="300" r="30" fill="#FFA700" stroke="#16181d" stroke-width="2"/>
  <circle cx="363" cy="300" r="3" fill="#16181d"/>

  <!-- angle arcs -->
  <path d="M230,130 A110,110 0 0 1 219.7,176.5" fill="none" stroke="#16181d" stroke-width="2"/>
  <text x="238" y="160" font-size="13" font-weight="700" fill="#16181d">mount pitch</text>
  <text x="238" y="176" font-size="13" fill="#16181d">(-25 deg, tilted down)</text>
  <path d="M265.0,197.6 A160,160 0 0 1 251.1,221.8" fill="none" stroke="#FFA700" stroke-width="3"/>
  <line x1="250" y1="238" x2="257" y2="214" stroke="#FFA700" stroke-width="1.5"/>
  <text x="200" y="252" font-size="13" font-weight="700" fill="#16181d">ty (-10 deg)</text>

  <!-- camera height dim -->
  <line x1="25" y1="134" x2="25" y2="326" stroke="#16181d" stroke-width="1.5" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="20" y1="130" x2="108" y2="130" stroke="#c9ced8" stroke-width="1"/>
  <text x="32" y="200" font-size="13" font-weight="700" fill="#16181d">camera</text>
  <text x="32" y="216" font-size="13" font-weight="700" fill="#16181d">height</text>
  <text x="32" y="232" font-size="13" fill="#16181d">0.50 m</text>

  <!-- piece height dim -->
  <line x1="405" y1="303" x2="405" y2="326" stroke="#16181d" stroke-width="1.5" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="366" y1="300" x2="410" y2="300" stroke="#c9ced8" stroke-width="1"/>
  <text x="412" y="312" font-size="13" fill="#16181d">piece center</text>
  <text x="412" y="327" font-size="13" fill="#16181d">0.075 m</text>

  <!-- distance dim -->
  <line x1="124" y1="372" x2="359" y2="372" stroke="#000AB5" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="120" y1="335" x2="120" y2="380" stroke="#c9ced8" stroke-width="1"/>
  <line x1="363" y1="335" x2="363" y2="380" stroke="#c9ced8" stroke-width="1"/>
  <text x="241" y="398" text-anchor="middle" font-size="14" font-weight="700" fill="#000AB5">d = distance along the floor</text>

  <!-- formula box -->
  <rect x="585" y="55" width="280" height="300" rx="10" fill="#f4f5f9" stroke="#000AB5" stroke-width="2.5"/>
  <text x="725" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#000AB5">The math</text>
  <text x="600" y="110" font-size="13" fill="#16181d">angle below level =</text>
  <text x="600" y="128" font-size="13" font-weight="700" fill="#16181d">  -(mount pitch + ty)</text>
  <text x="600" y="146" font-size="13" fill="#16181d">  = -(-25 + -10) = 35 deg</text>
  <text x="600" y="176" font-size="13" fill="#16181d">d = (camera height - piece</text>
  <text x="600" y="194" font-size="13" fill="#16181d">      height) / tan(angle)</text>
  <text x="600" y="212" font-size="13" fill="#16181d">  = 0.425 / tan(35 deg)</text>
  <text x="600" y="230" font-size="13" font-weight="700" fill="#16181d">  = 0.61 m</text>
  <line x1="600" y1="246" x2="850" y2="246" stroke="#c9ced8" stroke-width="1.5"/>
  <text x="600" y="268" font-size="13" fill="#16181d">Piece further away: it moves</text>
  <text x="600" y="286" font-size="13" fill="#16181d">up in the image, ty grows,</text>
  <text x="600" y="304" font-size="13" fill="#16181d">angle shrinks, d grows.</text>
  <text x="600" y="330" font-size="13" fill="#16181d">ty = +5 deg here gives 1.17 m</text>
</svg>
