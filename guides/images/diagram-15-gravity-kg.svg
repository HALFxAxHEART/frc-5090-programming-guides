<text x="200" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#000AB5">Gravity is the same at every height</text><text x="630" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#000AB5">What kG fixes: sag</text><rect x="70" y="60" width="10" height="330" fill="#c9ced8" stroke="#16181d"/><rect x="170" y="60" width="10" height="330" fill="#c9ced8" stroke="#16181d"/><line x1="40" y1="390" x2="220" y2="390" stroke="#16181d" stroke-width="2"/><rect x="95" y="92" width="60" height="36" rx="3" fill="#fff3d6" stroke="#16181d" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="110" y1="128" x2="110" y2="151" stroke="#16181d" stroke-width="3"/><path d="M103,151 L110,162 L117,151 z" fill="#16181d"/><line x1="140" y1="92" x2="140" y2="69" stroke="#000AB5" stroke-width="3"/><path d="M133,69 L140,58 L147,69 z" fill="#000AB5"/><rect x="95" y="197" width="60" height="36" rx="3" fill="#FFA700" stroke="#16181d" stroke-width="1.2" /><line x1="110" y1="233" x2="110" y2="256" stroke="#16181d" stroke-width="3"/><path d="M103,256 L110,267 L117,256 z" fill="#16181d"/><line x1="140" y1="197" x2="140" y2="174" stroke="#000AB5" stroke-width="3"/><path d="M133,174 L140,163 L147,174 z" fill="#000AB5"/><rect x="95" y="302" width="60" height="36" rx="3" fill="#fff3d6" stroke="#16181d" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="110" y1="338" x2="110" y2="361" stroke="#16181d" stroke-width="3"/><path d="M103,361 L110,372 L117,361 z" fill="#16181d"/><line x1="140" y1="302" x2="140" y2="279" stroke="#000AB5" stroke-width="3"/><path d="M133,279 L140,268 L147,279 z" fill="#000AB5"/><text x="196" y="46" text-anchor="middle" font-size="15" font-weight="400" fill="#16181d"></text><text x="232" y="96" text-anchor="start" font-size="15" font-weight="700" fill="#000AB5">kG push (up)</text><text x="232" y="116" text-anchor="start" font-size="15" font-weight="700" fill="#16181d">gravity (down)</text><text x="232" y="206" text-anchor="start" font-size="15" font-weight="400" fill="#16181d">Same size arrows</text><text x="232" y="226" text-anchor="start" font-size="15" font-weight="400" fill="#16181d">at every height, so</text><text x="232" y="246" text-anchor="start" font-size="15" font-weight="400" fill="#16181d">holding still takes</text><text x="232" y="266" text-anchor="start" font-size="15" font-weight="400" fill="#16181d">one constant voltage:</text><text x="232" y="286" text-anchor="start" font-size="15" font-weight="400" fill="#16181d">kG (about 0.3 V in</text><text x="232" y="306" text-anchor="start" font-size="15" font-weight="400" fill="#16181d">the example)</text><line x1="460" y1="360" x2="830" y2="360" stroke="#16181d" stroke-width="2"/><line x1="460" y1="360" x2="460" y2="80" stroke="#16181d" stroke-width="2"/><text x="645" y="386" text-anchor="middle" font-size="15" font-weight="400" fill="#16181d">time</text><text x="446" y="220" text-anchor="middle" font-size="15" fill="#16181d" transform="rotate(-90 446 220)">carriage height</text><line x1="460" y1="140" x2="830" y2="140" stroke="#FFA700" stroke-width="3" stroke-dasharray="8 6"/><text x="830" y="130" text-anchor="end" font-size="15" font-weight="700" fill="#16181d">target</text><path d="M465.0,354.0L470.9,353.6L476.8,352.4L482.8,350.6L488.7,348.0L494.6,344.8L500.5,341.0L506.4,336.6L512.3,331.7L518.3,326.4L524.2,320.6L530.1,314.3L536.0,307.8L541.9,300.9L547.8,293.7L553.8,286.3L559.7,278.7L565.6,270.9L571.5,263.0L577.4,255.0L583.3,247.0L589.3,239.0L595.2,231.0L601.1,223.1L607.0,215.3L612.9,207.7L618.8,200.3L624.8,193.1L630.7,186.2L636.6,179.7L642.5,173.4L648.4,167.6L654.3,162.3L660.3,157.4L666.2,153.0L672.1,149.2L678.0,146.0L683.9,143.4L689.8,141.6L695.8,140.4L701.7,140.0L707.6,140.0L713.5,140.0L719.4,140.0L725.3,140.0L731.3,140.0L737.2,140.0L743.1,140.0L749.0,140.0L754.9,140.0L760.8,140.0L766.8,140.0L772.7,140.0L778.6,140.0L784.5,140.0L790.4,140.0L796.3,140.0L802.3,140.0L808.2,140.0L814.1,140.0L820.0,140.0" fill="none" stroke="#000AB5" stroke-width="3.5"/><path d="M465.0,354.0L470.9,353.7L476.8,352.8L482.8,351.3L488.7,349.3L494.6,346.7L500.5,343.7L506.4,340.3L512.3,336.4L518.3,332.2L524.2,327.6L530.1,322.7L536.0,317.5L541.9,312.1L547.8,306.4L553.8,300.5L559.7,294.5L565.6,288.4L571.5,282.1L577.4,275.8L583.3,269.5L589.3,263.2L595.2,256.9L601.1,250.6L607.0,244.5L612.9,238.5L618.8,232.6L624.8,226.9L630.7,221.5L636.6,216.3L642.5,211.4L648.4,206.8L654.3,202.6L660.3,198.7L666.2,195.3L672.1,192.3L678.0,189.7L683.9,187.7L689.8,186.2L695.8,185.3L701.7,185.0L707.6,185.0L713.5,185.0L719.4,185.0L725.3,185.0L731.3,185.0L737.2,185.0L743.1,185.0L749.0,185.0L754.9,185.0L760.8,185.0L766.8,185.0L772.7,185.0L778.6,185.0L784.5,185.0L790.4,185.0L796.3,185.0L802.3,185.0L808.2,185.0L814.1,185.0L820.0,185.0" fill="none" stroke="#16181d" stroke-width="2.5" stroke-dasharray="3 4"/><text x="690" y="124" text-anchor="end" font-size="15" font-weight="700" fill="#000AB5">with kG: holds on target</text><text x="820" y="256" text-anchor="end" font-size="15" font-weight="700" fill="#16181d">without kG: settles low</text><text x="820" y="276" text-anchor="end" font-size="15" font-weight="400" fill="#16181d">(kP needs error to push)</text><line x1="812" y1="143" x2="812" y2="182" stroke="#16181d" stroke-width="2"/><line x1="806" y1="143" x2="818" y2="143" stroke="#16181d" stroke-width="2"/><line x1="806" y1="182" x2="818" y2="182" stroke="#16181d" stroke-width="2"/><text x="820" y="170" text-anchor="start" font-size="14" font-weight="700" fill="#16181d">sag</text></svg>