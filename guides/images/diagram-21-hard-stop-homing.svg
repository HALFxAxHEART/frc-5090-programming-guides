<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590">
<rect width="900" height="590" fill="#ffffff"/>
<text x="450" y="28" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#16181d" text-anchor="middle">Hard-stop homing (2026 intake): steady 0.8 V outward, watch the velocity</text>
<rect x="130" y="80" width="136.875" height="440" fill="#f4f5f9"/>
<text x="198.4375" y="62" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16181d" text-anchor="middle">ignore window</text>
<text x="198.4375" y="77" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16181d" text-anchor="middle">first 0.3 s</text>
<line x1="586.25" y1="80" x2="586.25" y2="520" stroke="#c9ced8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="586.25" y="62" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16181d" text-anchor="middle">hits the</text>
<text x="586.25" y="77" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16181d" text-anchor="middle">16 in stop</text>
<line x1="700.3125" y1="80" x2="700.3125" y2="520" stroke="#FFA700" stroke-width="3"/>
<text x="708.3125" y="62" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#16181d">setPosition(16 in)</text>
<text x="708.3125" y="77" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16181d">state = READY</text>
<line x1="130" y1="215" x2="860" y2="215" stroke="#16181d" stroke-width="1.5"/>
<line x1="130" y1="95" x2="130" y2="215" stroke="#16181d" stroke-width="1.5"/>
<text x="120" y="153.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#16181d" text-anchor="end">Velocity</text>
<text x="120" y="171.0" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16181d" text-anchor="end">(motor rps)</text>
<line x1="130" y1="200" x2="860" y2="200" stroke="#16181d" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="860" y="194" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16181d" text-anchor="end">0.5 rps: below = "stopped"</text>
<polyline fill="none" stroke="#000AB5" stroke-width="3" points="130.0,215 148.2,215 212.1,118 266.9,112 403.8,114 577.1,113 599.9,214 700.3,214"/>
<path d="M602.21875,150 v-8 H700.3125 v8" fill="none" stroke="#FFA700" stroke-width="2.5"/>
<text x="651.265625" y="134" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#16181d" text-anchor="middle">stopped 0.2 s</text>
<text x="403.75" y="104" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16181d" text-anchor="middle">moving out, about 14 in/s</text>
<line x1="130" y1="370" x2="860" y2="370" stroke="#16181d" stroke-width="1.5"/>
<line x1="130" y1="250" x2="130" y2="370" stroke="#16181d" stroke-width="1.5"/>
<text x="120" y="308.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#16181d" text-anchor="end">Stator</text>
<text x="120" y="326.0" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16181d" text-anchor="end">current (A)</text>
<line x1="130" y1="268" x2="860" y2="268" stroke="#16181d" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="412.875" y="262" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16181d" text-anchor="middle">20 A stator limit</text>
<polyline fill="none" stroke="#000AB5" stroke-width="3" points="130.0,370 143.7,370 161.9,300 221.2,338 577.1,340 604.5,268 700.3,268"/>
<text x="715.4375" y="300" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16181d">pinned at the limit while</text>
<text x="715.4375" y="316" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16181d">stalled, so velocity (not</text>
<text x="715.4375" y="332" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16181d">current) decides "stopped"</text>
<line x1="130" y1="505" x2="860" y2="505" stroke="#16181d" stroke-width="1.5"/>
<line x1="130" y1="405" x2="130" y2="505" stroke="#16181d" stroke-width="1.5"/>
<text x="120" y="453.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#16181d" text-anchor="end">Position</text>
<text x="120" y="471.0" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16181d" text-anchor="end">reading (in)</text>
<polyline fill="none" stroke="#000AB5" stroke-width="3" points="130.0,505.0 157.4,505.0 212.1,499.9 586.2,443.1 700.3,443.1"/>
<line x1="700.3125" y1="443.125" x2="700.3125" y2="415.0" stroke="#000AB5" stroke-width="3"/>
<line x1="700.3125" y1="415.0" x2="860" y2="415.0" stroke="#000AB5" stroke-width="3"/>
<text x="142" y="470" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16181d">starts at the power-on zero (0 in)</text>
<text x="570" y="421" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16181d" text-anchor="end">reads 11 in: wrong, it was 5 in out at power-on</text>
<text x="708.3125" y="433.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#16181d">snaps to 16 in (true)</text>
<line x1="130.0" y1="505" x2="130.0" y2="511" stroke="#16181d" stroke-width="1.5"/>
<text x="130.0" y="528" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16181d" text-anchor="middle">0 s</text>
<line x1="312.5" y1="505" x2="312.5" y2="511" stroke="#16181d" stroke-width="1.5"/>
<text x="312.5" y="528" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16181d" text-anchor="middle">0.4 s</text>
<line x1="495.0" y1="505" x2="495.0" y2="511" stroke="#16181d" stroke-width="1.5"/>
<text x="495.0" y="528" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16181d" text-anchor="middle">0.8 s</text>
<line x1="677.5" y1="505" x2="677.5" y2="511" stroke="#16181d" stroke-width="1.5"/>
<text x="677.5" y="528" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16181d" text-anchor="middle">1.2 s</text>
<line x1="860.0" y1="505" x2="860.0" y2="511" stroke="#16181d" stroke-width="1.5"/>
<text x="860.0" y="528" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16181d" text-anchor="middle">1.6 s</text>
<text x="495.0" y="552" font-family="Inter, Arial, sans-serif" font-size="14" fill="#16181d" text-anchor="middle">time since homing started (example run)</text>
<text x="495.0" y="576" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16181d" text-anchor="middle">If no stall comes within 4 s, homing gives up and keeps the power-on zero.</text>
</svg>