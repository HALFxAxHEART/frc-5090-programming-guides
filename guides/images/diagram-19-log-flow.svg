<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Inter, Arial, sans-serif" fill="#16181d">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000AB5"/></marker>
  </defs>
  <rect width="900" height="470" fill="#fff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="700">Where our logs come from and where they end up</text>

  <!-- column headers -->
  <text x="125" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#000AB5">ON THE ROBOT</text>
  <text x="450" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#000AB5">FILES</text>
  <text x="772" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#000AB5">OPEN WITH</text>

  <!-- sources -->
  <rect x="20" y="80" width="210" height="96" rx="8" fill="#f4f5f9" stroke="#16181d" stroke-width="1.5"/>
  <text x="125" y="104" text-anchor="middle" font-size="15" font-weight="700">Our code</text>
  <text x="125" y="125" text-anchor="middle" font-size="13">SmartDashboard.put... (NT)</text>
  <text x="125" y="143" text-anchor="middle" font-size="13">RobotLog.event / pose</text>
  <text x="125" y="161" text-anchor="middle" font-size="13">joysticks, console, commands</text>

  <rect x="20" y="196" width="210" height="80" rx="8" fill="#f4f5f9" stroke="#16181d" stroke-width="1.5"/>
  <text x="125" y="220" text-anchor="middle" font-size="15" font-weight="700">CTRE devices</text>
  <text x="125" y="241" text-anchor="middle" font-size="13">Talon FX/FXS, CANcoder, Pigeon</text>
  <text x="125" y="259" text-anchor="middle" font-size="13">current, voltage, temp, faults</text>

  <rect x="20" y="330" width="210" height="80" rx="8" fill="#f4f5f9" stroke="#16181d" stroke-width="1.5"/>
  <text x="125" y="354" text-anchor="middle" font-size="15" font-weight="700">Driver Station laptop</text>
  <text x="125" y="375" text-anchor="middle" font-size="13">records automatically:</text>
  <text x="125" y="393" text-anchor="middle" font-size="13">battery, lost packets, modes</text>

  <!-- USB stick -->
  <rect x="300" y="78" width="300" height="214" rx="12" fill="#fff" stroke="#FFA700" stroke-width="3"/>
  <text x="450" y="102" text-anchor="middle" font-size="15" font-weight="700">USB stick in the roboRIO (/u)</text>
  <rect x="318" y="114" width="264" height="72" rx="8" fill="#000AB5"/>
  <text x="450" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">/u/logs/*.wpilog</text>
  <text x="450" y="162" text-anchor="middle" font-size="13" fill="#fff">WPILib DataLogManager</text>
  <text x="450" y="178" text-anchor="middle" font-size="13" fill="#fff">(also every NT value)</text>
  <rect x="318" y="200" width="264" height="72" rx="8" fill="#000AB5"/>
  <text x="450" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">/u/ctre-logs/*.hoot</text>
  <text x="450" y="248" text-anchor="middle" font-size="13" fill="#fff">CTRE SignalLogger</text>
  <text x="450" y="264" text-anchor="middle" font-size="13" fill="#fff">(one file per CAN bus)</text>
  <text x="450" y="314" text-anchor="middle" font-size="13">Both started by RobotLog.start(),</text>
  <text x="450" y="331" text-anchor="middle" font-size="13">the first line of Robot()</text>

  <rect x="318" y="346" width="264" height="64" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/>
  <text x="450" y="372" text-anchor="middle" font-size="15" font-weight="700">.dslog + .dsevents</text>
  <text x="450" y="393" text-anchor="middle" font-size="13">on the DS laptop</text>

  <!-- source arrows -->
  <line x1="230" y1="140" x2="314" y2="150" stroke="#000AB5" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="230" y1="236" x2="314" y2="236" stroke="#000AB5" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="230" y1="378" x2="314" y2="378" stroke="#000AB5" stroke-width="3" marker-end="url(#ah)"/>

  <!-- viewers -->
  <rect x="670" y="140" width="210" height="100" rx="10" fill="#fff" stroke="#000AB5" stroke-width="3"/>
  <text x="775" y="182" text-anchor="middle" font-size="17" font-weight="700">AdvantageScope</text>
  <text x="775" y="204" text-anchor="middle" font-size="13">opens all of them,</text>
  <text x="775" y="221" text-anchor="middle" font-size="13">timestamps lined up</text>
  <rect x="670" y="346" width="210" height="64" rx="8" fill="#f4f5f9" stroke="#16181d" stroke-width="1.5"/>
  <text x="775" y="372" text-anchor="middle" font-size="14" font-weight="700">DS Log File Viewer</text>
  <text x="775" y="393" text-anchor="middle" font-size="13">fastest for comms vs power</text>
  <rect x="670" y="262" width="210" height="52" rx="8" fill="#f4f5f9" stroke="#16181d" stroke-width="1.5"/>
  <text x="775" y="284" text-anchor="middle" font-size="14" font-weight="700">Tuner X Log Extractor</text>
  <text x="775" y="303" text-anchor="middle" font-size="13">converts .hoot if needed</text>

  <line x1="582" y1="150" x2="666" y2="180" stroke="#000AB5" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="582" y1="236" x2="666" y2="206" stroke="#000AB5" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="582" y1="248" x2="666" y2="282" stroke="#c9ced8" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="582" y1="366" x2="666" y2="228" stroke="#c9ced8" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="582" y1="384" x2="666" y2="380" stroke="#000AB5" stroke-width="3" marker-end="url(#ah)"/>

  <text x="450" y="452" text-anchor="middle" font-size="13">No USB stick? The .wpilog and .hoot go to the roboRIO's small internal storage. Check Logging/USB stick = true.</text>
</svg>
