<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16181d"/>
    </marker>
  </defs>
  <!-- plot area: x -1..1 rot -> 110..710 (300 px per rot), y -30..30 A -> 400..40 (6 px per A); origin (410,220) -->
  <!-- grid -->
  <g stroke="#c9ced8" stroke-width="1">
    <line x1="110" y1="70" x2="710" y2="70" stroke-dasharray="4 4"/>
    <line x1="110" y1="370" x2="710" y2="370" stroke-dasharray="4 4"/>
    <line x1="597.5" y1="40" x2="597.5" y2="400" stroke-dasharray="4 4"/>
    <line x1="222.5" y1="40" x2="222.5" y2="400" stroke-dasharray="4 4"/>
  </g>
  <!-- axes -->
  <line x1="100" y1="220" x2="730" y2="220" stroke="#16181d" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="410" y1="410" x2="410" y2="30" stroke="#16181d" stroke-width="2" marker-end="url(#arr)"/>

  <!-- curve: flat -25 until -0.625 (x=222.5), linear to +25 at +0.625 (x=597.5), flat after -->
  <polyline points="110,370 222.5,370 597.5,70 710,70" fill="none" stroke="#000AB5" stroke-width="4"/>
  <!-- cap highlight -->
  <line x1="597.5" y1="70" x2="710" y2="70" stroke="#FFA700" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <line x1="110" y1="370" x2="222.5" y2="370" stroke="#FFA700" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <polyline points="110,370 222.5,370 597.5,70 710,70" fill="none" stroke="#000AB5" stroke-width="3"/>

  <!-- axis labels -->
  <text x="730" y="244" text-anchor="end" font-size="14" fill="#16181d">error = target - position</text>
  <text x="730" y="262" text-anchor="end" font-size="13" fill="#16181d">(mechanism rotations)</text>
  <text x="420" y="28" font-size="14" fill="#16181d">torque current (A)</text>
  <text x="420" y="46" font-size="13" fill="#16181d">= push back toward target</text>

  <!-- ticks -->
  <text x="400" y="74" text-anchor="end" font-size="13" fill="#16181d">+25 A</text>
  <text x="400" y="374" text-anchor="end" font-size="13" fill="#16181d">-25 A</text>
  <text x="597.5" y="420" text-anchor="middle" font-size="13" fill="#16181d">+0.625</text>
  <text x="222.5" y="420" text-anchor="middle" font-size="13" fill="#16181d">-0.625</text>

  <!-- annotations -->
  <text x="440" y="305" font-size="14" font-weight="700" fill="#000AB5">slope = kP = 40 A per rotation</text>
  <text x="440" y="323" font-size="13" fill="#16181d">(the stiffness k: more error, more push)</text>
  <text x="600" y="102" font-size="13" font-weight="700" fill="#16181d">capped at 25 A:</text>
  <text x="600" y="118" font-size="13" fill="#16181d">push harder and it</text>
  <text x="600" y="134" font-size="13" fill="#16181d">just gives way</text>
  <text x="115" y="296" font-size="13" fill="#16181d">same cap the other way</text>
  <text x="115" y="312" font-size="13" fill="#16181d">(PeakReverse = -25 A)</text>

  <text x="410" y="452" text-anchor="middle" font-size="13" fill="#16181d">Shown with the mechanism standing still (damping term kD * velocity = 0). 25 A / 40 A per rot = 0.625 rot.</text>
</svg>
