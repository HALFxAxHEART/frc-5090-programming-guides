  <text x="20" y="179" font-size="13" text-anchor="start" fill="#5a6070">turret, hood, arm, elevator</text>
  <rect x="260" y="140" width="78" height="44" rx="8" fill="#fff8e8" stroke="#c07d00" stroke-width="2.5"/><text x="299" y="168" font-size="17" text-anchor="middle" font-weight="700">kG</text>
  <polyline points="340,162 364,162" fill="none" stroke="#000AB5" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="366" y="140" width="78" height="44" rx="8" fill="#fff8e8" stroke="#c07d00" stroke-width="2.5"/><text x="405" y="168" font-size="17" text-anchor="middle" font-weight="700">kS</text>
  <polyline points="446,162 470,162" fill="none" stroke="#000AB5" stroke-width="2" marker-end="url(#ah)"/>
