  <rect x="20" y="222" width="26" height="20" rx="8" fill="#fff8e8" stroke="#c07d00" stroke-width="2.5"/>
  <text x="54" y="237" font-size="13" text-anchor="start">feedforward: gets you close with no error needed</text>
