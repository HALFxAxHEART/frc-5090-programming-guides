  <rect x="578" y="140" width="78" height="44" rx="8" fill="#fff8e8" stroke="#c07d00" stroke-width="2.5" stroke-dasharray="6 4"/><text x="617" y="168" font-size="17" text-anchor="middle" font-weight="700">(kA)</text>
