<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" font-family="Inter, Arial, sans-serif">
  <rect width="880" height="570" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#16181d">Anatomy of a brownout (shape only, not to scale in time)</text>

  <!-- brownout band -->
  <rect x="380" y="50" width="50" height="282" fill="#FFA700" fill-opacity="0.35"/>
  <rect x="380" y="380" width="50" height="140" fill="#FFA700" fill-opacity="0.35"/>
  <text x="440" y="296" font-size="14" font-weight="700" fill="#16181d">&#8592; BROWNOUT (shaded): CAN motor controllers disabled,</text>
  <text x="460" y="314" font-size="13" fill="#16181d">PWM, relays and user rails off. The robot "stutters".</text>

  <!-- axes -->
  <line x1="110" y1="50" x2="110" y2="332" stroke="#16181d" stroke-width="1.5"/>
  <line x1="110" y1="332" x2="840" y2="332" stroke="#16181d" stroke-width="1.5"/>
  <g font-size="13" fill="#16181d" text-anchor="end">
    <text x="102" y="79">12.5 V</text>
    <text x="102" y="139">10.5 V</text>
    <text x="102" y="289">5.5 V</text>
  </g>
  <text x="34" y="190" font-size="14" font-weight="700" fill="#16181d" transform="rotate(-90 34 190)" text-anchor="middle">voltage at the roboRIO</text>

  <!-- thresholds -->
  <line x1="110" y1="225" x2="840" y2="225" stroke="#16181d" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="836" y="217" text-anchor="end" font-size="13" font-weight="700" fill="#16181d">7.5 V: brownout ends when voltage rises above this</text>
  <line x1="110" y1="247.5" x2="840" y2="247.5" stroke="#000AB5" stroke-width="2"/>
  <text x="836" y="266" text-anchor="end" font-size="13" font-weight="700" fill="#000AB5">6.75 V: brownout starts (roboRIO 2 default)</text>

