  <text x="118" y="66" font-size="13" fill="#16181d">idle, about 12.5 V</text>
  <text x="120" y="290" font-size="13" fill="#16181d">drive + shooter + rollers</text>
  <text x="120" y="308" font-size="13" fill="#16181d">all pull hard: voltage sags</text>
  <text x="650" y="138" font-size="13" fill="#16181d">motors back on,</text>
  <text x="650" y="155" font-size="13" fill="#16181d">driver eased off</text>

