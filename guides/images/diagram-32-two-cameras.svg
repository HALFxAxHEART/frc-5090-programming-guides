<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="15" font-weight="700" fill="#16181d">Top view: one camera per job</text>

  <!-- tag wall on left -->
  <rect x="20" y="70" width="14" height="210" fill="#c9ced8" stroke="#16181d"/>
  <rect x="36" y="105" width="22" height="22" fill="#ffffff" stroke="#16181d" stroke-width="2"/>
  <rect x="41" y="110" width="6" height="6" fill="#16181d"/><rect x="49" y="117" width="5" height="5" fill="#16181d"/>
  <rect x="36" y="225" width="22" height="22" fill="#ffffff" stroke="#16181d" stroke-width="2"/>
  <rect x="41" y="230" width="6" height="6" fill="#16181d"/><rect x="49" y="237" width="5" height="5" fill="#16181d"/>
  <text x="66" y="185" font-size="13" fill="#16181d">AprilTags</text>
  <text x="66" y="201" font-size="13" fill="#16181d">on a wall</text>

  <!-- back camera view cone (faces left) -->
  <polygon points="300,175 80,85 80,265" fill="#000AB5" fill-opacity="0.10" stroke="#000AB5" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- front camera view cone (faces right) -->
  <polygon points="440,175 640,95 640,255" fill="#FFA700" fill-opacity="0.25" stroke="#FFA700" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- robot -->
  <rect x="300" y="115" width="140" height="120" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="3"/>
  <text x="370" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#000AB5">robot</text>
  <text x="370" y="190" text-anchor="middle" font-size="13" fill="#16181d">front -&gt;</text>
  <rect x="440" y="125" width="10" height="100" fill="#c9ced8" stroke="#16181d"/>
  <rect x="436" y="163" width="16" height="24" rx="3" fill="#FFA700" stroke="#16181d"/>
  <rect x="292" y="163" width="16" height="24" rx="3" fill="#000AB5"/>

  <!-- pieces -->
  <circle cx="560" cy="150" r="13" fill="#FFA700" stroke="#16181d" stroke-width="2"/>
  <circle cx="600" cy="205" r="13" fill="#FFA700" stroke="#16181d" stroke-width="2"/>
  <circle cx="530" cy="215" r="13" fill="#FFA700" stroke="#16181d" stroke-width="2"/>

  <!-- labels -->
  <text x="190" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#000AB5">"limelight-tags" (back)</text>
  <text x="190" y="318" text-anchor="middle" font-size="13" fill="#16181d">AprilTag pipeline, tilted up</text>
  <text x="560" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#16181d">"limelight-intake" (front)</text>
  <text x="560" y="308" text-anchor="middle" font-size="13" fill="#16181d">Neural Detector, tilted down</text>
  <text x="455" y="105" font-size="13" fill="#16181d">intake</text>

  <!-- explanation box -->
  <rect x="665" y="60" width="180" height="210" rx="10" fill="#f4f5f9" stroke="#c9ced8" stroke-width="2"/>
  <text x="680" y="86" font-size="13" font-weight="700" fill="#16181d">Why two cameras?</text>
  <text x="680" y="110" font-size="13" fill="#16181d">Each pipeline wants</text>
  <text x="680" y="128" font-size="13" fill="#16181d">a different aim and</text>
  <text x="680" y="146" font-size="13" fill="#16181d">different exposure.</text>
  <text x="680" y="172" font-size="13" fill="#16181d">One camera can only</text>
  <text x="680" y="190" font-size="13" fill="#16181d">run one pipeline at</text>
  <text x="680" y="208" font-size="13" fill="#16181d">a time, so switching</text>
  <text x="680" y="226" font-size="13" fill="#16181d">means losing one job</text>
  <text x="680" y="244" font-size="13" fill="#16181d">while the other runs.</text>
</svg>
