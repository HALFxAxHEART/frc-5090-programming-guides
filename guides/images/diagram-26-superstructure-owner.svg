<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000AB5"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16181d"/></marker>
  </defs>
  <rect width="860" height="470" fill="#ffffff"/>
  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#16181d">One coordinator owns every mechanism that can collide</text>

  <!-- requesters -->
  <rect x="20" y="70" width="190" height="64" rx="10" fill="#f4f5f9" stroke="#c9ced8" stroke-width="2"/>
  <text x="115" y="97" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">Operator buttons</text>
  <text x="115" y="118" text-anchor="middle" font-size="13" fill="#16181d">"L3", "Stow", "Intake"</text>
  <rect x="20" y="152" width="190" height="64" rx="10" fill="#f4f5f9" stroke="#c9ced8" stroke-width="2"/>
  <text x="115" y="179" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">Autos</text>
  <text x="115" y="200" text-anchor="middle" font-size="13" fill="#16181d">PathPlanner named cmds</text>
  <rect x="20" y="234" width="190" height="64" rx="10" fill="#f4f5f9" stroke="#c9ced8" stroke-width="2"/>
  <text x="115" y="261" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">Triggers</text>
  <text x="115" y="282" text-anchor="middle" font-size="13" fill="#16181d">"coral loaded → stow"</text>

  <line x1="212" y1="102" x2="300" y2="170" stroke="#000AB5" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="212" y1="184" x2="300" y2="184" stroke="#000AB5" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="212" y1="266" x2="300" y2="198" stroke="#000AB5" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="115" y="326" text-anchor="middle" font-size="13" fill="#16181d">They only</text>
  <text x="115" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#16181d">REQUEST a goal</text>

  <!-- superstructure -->
  <rect x="304" y="70" width="270" height="300" rx="14" fill="#000AB5"/>
  <text x="439" y="102" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Superstructure</text>
  <text x="439" y="122" text-anchor="middle" font-size="13" fill="#ffffff">(one subsystem for all three)</text>
  <rect x="322" y="138" width="234" height="44" rx="8" fill="#ffffff"/>
  <text x="439" y="157" text-anchor="middle" font-size="13" fill="#16181d">wanted goal: <tspan font-weight="700">L3</tspan></text>
  <text x="439" y="174" text-anchor="middle" font-size="13" fill="#16181d">current: <tspan font-weight="700">STOW</tspan>, phase <tspan font-weight="700">TUCKING</tspan></text>
  <rect x="322" y="192" width="234" height="74" rx="8" fill="#FFA700"/>
  <text x="439" y="214" text-anchor="middle" font-size="14" font-weight="700" fill="#16181d">Safety rules</text>
  <text x="439" y="234" text-anchor="middle" font-size="13" fill="#16181d">arm tucked while elevator moves</text>
  <text x="439" y="253" text-anchor="middle" font-size="13" fill="#16181d">guards: right game piece?</text>
  <rect x="322" y="276" width="234" height="78" rx="8" fill="#ffffff"/>
  <text x="439" y="298" text-anchor="middle" font-size="13" fill="#16181d">periodic(): pick the next safe</text>
  <text x="439" y="316" text-anchor="middle" font-size="13" fill="#16181d">step, send targets, check</text>
  <text x="439" y="334" text-anchor="middle" font-size="13" fill="#16181d">isAtGoal() and timeouts</text>

  <!-- mechanisms -->
  <rect x="660" y="70" width="180" height="56" rx="10" fill="#ffffff" stroke="#000AB5" stroke-width="2.5"/>
  <text x="750" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">Elevator</text>
  <text x="750" y="114" text-anchor="middle" font-size="13" fill="#16181d">2 Krakens, inches</text>
  <rect x="660" y="142" width="180" height="56" rx="10" fill="#ffffff" stroke="#000AB5" stroke-width="2.5"/>
  <text x="750" y="167" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">Arm (pivot)</text>
  <text x="750" y="186" text-anchor="middle" font-size="13" fill="#16181d">degrees</text>
  <rect x="660" y="214" width="180" height="56" rx="10" fill="#ffffff" stroke="#000AB5" stroke-width="2.5"/>
  <text x="750" y="239" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">Wrist</text>
  <text x="750" y="258" text-anchor="middle" font-size="13" fill="#16181d">degrees</text>
  <rect x="660" y="300" width="180" height="70" rx="10" fill="#f4f5f9" stroke="#c9ced8" stroke-width="2"/>
  <text x="750" y="325" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">Claw (own subsystem)</text>
  <text x="750" y="344" text-anchor="middle" font-size="13" fill="#16181d">rollers + CANrange</text>
  <text x="750" y="361" text-anchor="middle" font-size="13" fill="#16181d">knows the game piece</text>

  <line x1="576" y1="98" x2="656" y2="98" stroke="#000AB5" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="576" y1="170" x2="656" y2="170" stroke="#000AB5" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="576" y1="242" x2="656" y2="242" stroke="#000AB5" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="616" y="88" text-anchor="middle" font-size="13" fill="#16181d">target</text>
  <line x1="656" y1="335" x2="578" y2="335" stroke="#16181d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text x="617" y="325" text-anchor="middle" font-size="13" fill="#16181d">has piece?</text>

  <rect x="20" y="398" width="820" height="56" rx="10" fill="#f4f5f9" stroke="#c9ced8" stroke-width="2"/>
  <text x="430" y="421" text-anchor="middle" font-size="14" fill="#16181d">No command ever moves the elevator, arm, or wrist directly. They are plain classes owned by the</text>
  <text x="430" y="441" text-anchor="middle" font-size="14" fill="#16181d">Superstructure, so two commands can never fight over them, and every move passes the safety rules.</text>
</svg>
