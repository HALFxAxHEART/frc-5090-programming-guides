<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Inter, Arial, sans-serif">
<rect width="880" height="470" fill="#ffffff"/>
<text x="440" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#000AB5">MegaTag2, every loop, for every camera</text><rect x="15" y="56" width="190" height="96" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2.5"/><text x="110" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#000AB5">Robot heading</text><text x="110" y="101" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">from the Pigeon 2 gyro</text><text x="110" y="120" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">(driveState.Pose</text><text x="110" y="139" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">rotation, in degrees)</text><rect x="235" y="56" width="190" height="96" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2.5"/><text x="330" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#000AB5">SetRobotOrientation</text><text x="330" y="101" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">tells the camera</text><text x="330" y="120" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">our heading,</text><text x="330" y="139" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">BEFORE reading MT2</text><rect x="455" y="56" width="190" height="96" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2.5"/><text x="550" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#000AB5">Limelight</text><text x="550" y="101" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">sees AprilTags</text><text x="550" y="120" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">(one tag is enough</text><text x="550" y="139" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">with MT2)</text><rect x="675" y="56" width="190" height="96" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2.5"/><text x="770" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#000AB5">MegaTag2 botpose</text><text x="770" y="101" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">wpiBlue PoseEstimate:</text><text x="770" y="120" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">pose, timestamp,</text><text x="770" y="139" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">tagCount, ...</text><line x1="207" y1="104" x2="222" y2="104" stroke="#16181d" stroke-width="2.5"/><path d="M222,110 L233,104 L222,98 z" fill="#16181d"/><line x1="427" y1="104" x2="442" y2="104" stroke="#16181d" stroke-width="2.5"/><path d="M442,110 L453,104 L442,98 z" fill="#16181d"/><line x1="647" y1="104" x2="662" y2="104" stroke="#16181d" stroke-width="2.5"/><path d="M662,110 L673,104 L662,98 z" fill="#16181d"/><line x1="770" y1="154" x2="770" y2="223" stroke="#16181d" stroke-width="2.5"/><path d="M764,223 L770,234 L776,223 z" fill="#16181d"/><rect x="675" y="236" width="190" height="96" rx="8" fill="#fff3d6" stroke="#FFA700" stroke-width="2.5"/><text x="770" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#000AB5">Reject bad data</text><text x="770" y="281" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">no tags, or</text><text x="770" y="300" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">spinning ≥ 2 rot/s</text><text x="770" y="319" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">→ just return</text><rect x="455" y="236" width="190" height="96" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2.5"/><text x="550" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#000AB5">addVisionMeasurement</text><text x="550" y="281" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">std devs X, Y, heading:</text><text x="550" y="300" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">0.7 m, 0.7 m, 9999999</text><text x="550" y="319" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">(ignore its heading)</text><rect x="235" y="236" width="190" height="96" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2.5"/><text x="330" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#000AB5">Pose estimator</text><text x="330" y="281" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">blends vision with</text><text x="330" y="300" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">wheel odometry</text><text x="330" y="319" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">(in CTRE's swerve)</text><rect x="15" y="236" width="190" height="96" rx="8" fill="#000AB5" stroke="#000AB5" stroke-width="2.5"/><text x="110" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">getState().Pose</text><text x="110" y="281" text-anchor="middle" font-size="13" font-weight="400" fill="#ffffff">the best guess, used by</text><text x="110" y="300" text-anchor="middle" font-size="13" font-weight="400" fill="#ffffff">turret aiming, autos,</text><text x="110" y="319" text-anchor="middle" font-size="13" font-weight="400" fill="#ffffff">auto-align</text><line x1="673" y1="284" x2="658" y2="284" stroke="#16181d" stroke-width="2.5"/><path d="M658,278 L647,284 L658,290 z" fill="#16181d"/><text x="660" y="274" text-anchor="middle" font-size="13" font-weight="700" fill="#16181d">ok</text><line x1="453" y1="284" x2="438" y2="284" stroke="#16181d" stroke-width="2.5"/><path d="M438,278 L427,284 L438,290 z" fill="#16181d"/><line x1="233" y1="284" x2="218" y2="284" stroke="#16181d" stroke-width="2.5"/><path d="M218,278 L207,284 L218,290 z" fill="#16181d"/><rect x="235" y="380" width="190" height="62" rx="8" fill="#ffffff" stroke="#c9ced8" stroke-width="2.5"/><text x="330" y="407" text-anchor="middle" font-size="14" font-weight="700" fill="#000AB5">Wheel odometry</text><text x="330" y="426" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">+ Pigeon, every loop</text><line x1="330" y1="378" x2="330" y2="345" stroke="#16181d" stroke-width="2.5"/><path d="M336,345 L330,334 L324,345 z" fill="#16181d"/><text x="440" y="462" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">Vision X/Y corrects drift; the heading always comes from the Pigeon (MT2 needs a correct heading).</text></svg>