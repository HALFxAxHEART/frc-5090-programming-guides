<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
<rect width="900" height="560" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" fill="#16181d">
<text x="450" y="30" font-size="19" font-weight="700" text-anchor="middle">Where can the sensor go? (example: arm with a 50:1 gearbox)</text>

<!-- motor -->
<rect x="30" y="110" width="150" height="100" rx="10" fill="#000AB5"/>
<text x="105" y="152" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">Kraken X60</text>
<text x="105" y="174" font-size="13" text-anchor="middle" fill="#ffffff">motor + Talon FX</text>
<!-- shaft 1 -->
<rect x="180" y="152" width="70" height="16" fill="#c9ced8" stroke="#16181d"/>
<!-- gearbox -->
<rect x="250" y="95" width="170" height="130" rx="10" fill="#f4f5f9" stroke="#000AB5" stroke-width="3"/>
<text x="335" y="152" font-size="16" font-weight="700" text-anchor="middle">Gearbox</text>
<text x="335" y="174" font-size="14" text-anchor="middle">50 : 1</text>
<text x="335" y="196" font-size="13" text-anchor="middle">(has backlash)</text>
<!-- shaft 2 -->
<rect x="420" y="152" width="150" height="16" fill="#c9ced8" stroke="#16181d"/>
<!-- pivot + arm -->
<circle cx="600" cy="160" r="30" fill="#ffffff" stroke="#000AB5" stroke-width="3"/>
<circle cx="600" cy="160" r="6" fill="#16181d"/>
<line x1="600" y1="160" x2="840" y2="95" stroke="#000AB5" stroke-width="14" stroke-linecap="round"/>
<text x="760" y="160" font-size="15" font-weight="700">Arm</text>
<text x="760" y="180" font-size="13">(the mechanism)</text>

<!-- sensor A: built into motor -->
<circle cx="105" cy="245" r="17" fill="#FFA700" stroke="#16181d" stroke-width="1.5"/>
<text x="105" y="251" font-size="16" font-weight="700" text-anchor="middle">A</text>
<line x1="105" y1="228" x2="105" y2="212" stroke="#16181d" stroke-width="1.5"/>
<!-- sensor B: mechanism shaft -->
<circle cx="540" cy="115" r="17" fill="#FFA700" stroke="#16181d" stroke-width="1.5"/>
<text x="540" y="121" font-size="16" font-weight="700" text-anchor="middle">B</text>
<line x1="540" y1="132" x2="540" y2="151" stroke="#16181d" stroke-width="1.5"/>
<!-- sensor C: big gear on the output shaft drives a small pinion -->
<circle cx="465" cy="160" r="39" fill="none" stroke="#16181d" stroke-width="2.5" stroke-dasharray="6 3"/>
<circle cx="465" cy="212" r="13" fill="#ffffff" stroke="#16181d" stroke-width="2.5" stroke-dasharray="4 2"/>
<line x1="465" y1="225" x2="465" y2="250" stroke="#16181d" stroke-width="1.5"/>
<circle cx="465" cy="267" r="17" fill="#FFA700" stroke="#16181d" stroke-width="1.5"/>
<text x="465" y="273" font-size="16" font-weight="700" text-anchor="middle">C</text>
<text x="494" y="250" font-size="13">big gear on the arm shaft drives a</text>
<text x="494" y="268" font-size="13">small pinion: C turns 3x per arm turn</text>
<!-- table -->
<g font-size="14">
<rect x="30" y="310" width="840" height="34" fill="#000AB5"/>
<text x="45" y="332" font-weight="700" fill="#ffffff">Spot</text>
<text x="160" y="332" font-weight="700" fill="#ffffff">Turns per arm turn</text>
<text x="350" y="332" font-weight="700" fill="#ffffff">Absolute for the arm?</text>
<text x="560" y="332" font-weight="700" fill="#ffffff">Sees gearbox backlash?</text>
<text x="745" y="332" font-weight="700" fill="#ffffff">Resolution</text>

<rect x="30" y="344" width="840" height="62" fill="#f4f5f9"/>
<text x="45" y="370" font-weight="700">A  motor</text>
<text x="45" y="390" font-size="13">(built in)</text>
<text x="160" y="370">50</text>
<text x="350" y="370">No: 50 turns all look</text>
<text x="350" y="390">the same. Relative only.</text>
<text x="560" y="370">No: reads the motor,</text>
<text x="560" y="390">not the arm</text>
<text x="745" y="370" font-weight="700">Finest</text>
<text x="745" y="390" font-size="13">(x50 at the arm)</text>

<rect x="30" y="406" width="840" height="62" fill="#ffffff"/>
<text x="45" y="432" font-weight="700">B  arm shaft</text>
<text x="45" y="452" font-size="13">(1:1)</text>
<text x="160" y="432">1</text>
<text x="350" y="432" font-weight="700">Yes, if travel is</text>
<text x="350" y="452" font-weight="700">under one turn</text>
<text x="560" y="432">Yes: measures the</text>
<text x="560" y="452">real arm angle</text>
<text x="745" y="432">Coarsest</text>
<text x="745" y="452" font-size="13">(about 0.09°)</text>

<rect x="30" y="468" width="840" height="62" fill="#f4f5f9"/>
<text x="45" y="494" font-weight="700">C  geared up</text>
<text x="45" y="514" font-size="13">(e.g. turret pinion)</text>
<text x="160" y="494">3 (more than 1)</text>
<text x="350" y="494">Only if travel is under</text>
<text x="350" y="514">1/3 turn (or use CRT)</text>
<text x="560" y="494">Mostly yes (plus a</text>
<text x="560" y="514">little of its own mesh)</text>
<text x="745" y="494">3x finer</text>
<text x="745" y="514" font-size="13">than B</text>
<rect x="30" y="310" width="840" height="220" fill="none" stroke="#c9ced8"/>
</g>
<text x="450" y="552" font-size="13" text-anchor="middle">Rule: the sensor is absolute for the mechanism only if it turns less than once over the mechanism's whole travel.</text>
</g>
</svg>
