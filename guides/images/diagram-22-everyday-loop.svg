<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000AB5"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16181d"/></marker>
</defs>
<rect width="900" height="340" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" fill="#16181d">
  <!-- laptop -->
  <rect x="15" y="40" width="580" height="250" rx="12" fill="#ffffff" stroke="#c9ced8" stroke-width="2"/>
  <text x="35" y="68" font-size="17" font-weight="700">Your laptop</text>
  <text x="140" y="68" font-size="14">(Git: nothing leaves here until you push)</text>

  <rect x="35" y="100" width="160" height="100" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/>
  <text x="115" y="130" font-size="15" font-weight="700" text-anchor="middle">Working files</text>
  <text x="115" y="152" font-size="13" text-anchor="middle">edit, build,</text>
  <text x="115" y="170" font-size="13" text-anchor="middle">review the diff</text>

  <rect x="225" y="100" width="160" height="100" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/>
  <text x="305" y="130" font-size="15" font-weight="700" text-anchor="middle">Staged changes</text>
  <text x="305" y="152" font-size="13" text-anchor="middle">only the files</text>
  <text x="305" y="170" font-size="13" text-anchor="middle">you picked</text>

  <rect x="415" y="100" width="160" height="100" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/>
  <text x="495" y="130" font-size="15" font-weight="700" text-anchor="middle">Commits</text>
  <text x="495" y="152" font-size="13" text-anchor="middle">snapshots with</text>
  <text x="495" y="170" font-size="13" text-anchor="middle">a message</text>

  <line x1="196" y1="150" x2="222" y2="150" stroke="#000AB5" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="386" y1="150" x2="412" y2="150" stroke="#000AB5" stroke-width="3" marker-end="url(#ar)"/>
  <text x="210" y="226" font-size="14" font-weight="700" text-anchor="middle">+ stage</text>
  <text x="210" y="244" font-size="13" text-anchor="middle">git add</text>
  <text x="400" y="226" font-size="14" font-weight="700" text-anchor="middle">Commit</text>
  <text x="400" y="244" font-size="13" text-anchor="middle">git commit -m "..."</text>
  <line x1="210" y1="206" x2="210" y2="160" stroke="#c9ced8" stroke-width="1.5"/>
  <line x1="400" y1="206" x2="400" y2="160" stroke="#c9ced8" stroke-width="1.5"/>

  <!-- github -->
  <rect x="650" y="40" width="235" height="250" rx="12" fill="#ffffff" stroke="#c9ced8" stroke-width="2"/>
  <text x="670" y="68" font-size="17" font-weight="700">GitHub</text>

  <rect x="670" y="100" width="195" height="60" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/>
  <text x="767" y="126" font-size="15" font-weight="700" text-anchor="middle">Your branch</text>
  <text x="767" y="146" font-size="13" text-anchor="middle">shared with the team</text>

  <rect x="670" y="200" width="195" height="72" rx="8" fill="#FFA700" stroke="#16181d" stroke-width="1.5"/>
  <text x="767" y="226" font-size="15" font-weight="700" text-anchor="middle">Pull request</text>
  <text x="767" y="245" font-size="13" text-anchor="middle">review, then merge</text>
  <text x="767" y="262" font-size="13" text-anchor="middle">into main (or c3)</text>
  <line x1="767" y1="161" x2="767" y2="196" stroke="#000AB5" stroke-width="3" marker-end="url(#ar)"/>

  <!-- push / pull -->
  <line x1="576" y1="118" x2="666" y2="118" stroke="#000AB5" stroke-width="3" marker-end="url(#ar)"/>
  <text x="621" y="108" font-size="14" font-weight="700" text-anchor="middle">push</text>
  <line x1="666" y1="146" x2="580" y2="146" stroke="#16181d" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <text x="623" y="170" font-size="14" font-weight="700" text-anchor="middle">pull</text>

  <text x="450" y="322" font-size="14" text-anchor="middle">Pull before you start and pull again before you push. Sync Changes in VS Code does pull + push.</text>
</g>
</svg>
