<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="Inter, Arial, sans-serif">
<rect width="880" height="480" fill="#ffffff"/>
<text x="440" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#16181d">Facing the hub: the code picks the heading, the driver keeps the sticks</text>
<!-- field (blue half), 50 px per meter, origin at (60,440) -->
<rect x="60" y="56" width="400" height="384" fill="#f4f5f9" stroke="#c9ced8" stroke-width="2"/>
<rect x="52" y="56" width="8" height="384" fill="#000AB5"/>
<text x="40" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#000AB5" transform="rotate(-90 40 250)">blue alliance wall (x = 0)</text>
<!-- axes -->
<line x1="70" y1="458" x2="150" y2="458" stroke="#16181d" stroke-width="2"/><path d="M150,452 L162,458 L150,464 z" fill="#16181d"/>
<text x="168" y="463" font-size="13" fill="#16181d">+X (field)</text>
<line x1="476" y1="430" x2="476" y2="360" stroke="#16181d" stroke-width="2"/><path d="M470,360 L476,348 L482,360 z" fill="#16181d"/>
<text x="476" y="340" text-anchor="middle" font-size="13" fill="#16181d">+Y</text>
<!-- hub: center (4.625, 4.035) m -> (291.25, 238.25) px, 1.19 m square -->
<rect x="261.5" y="208.5" width="59.5" height="59.5" fill="#ffffff" stroke="#16181d" stroke-width="2.5"/>
<circle cx="291.25" cy="238.25" r="5" fill="#FFA700" stroke="#16181d" stroke-width="1.5"/>
<text x="291" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#16181d">blue hub center</text>
<text x="291" y="306" text-anchor="middle" font-size="13" fill="#16181d">(4.625, 4.035) m</text>
<!-- line robot -> hub: robot at (1.8, 6.4) m -> (150, 120) px -->
<line x1="150" y1="120" x2="286" y2="234" stroke="#16181d" stroke-width="2" stroke-dasharray="7 5"/>
<text x="238" y="170" font-size="13" font-style="italic" fill="#16181d">toHub</text>
<!-- robot -->
<rect x="130" y="100" width="40" height="40" rx="4" fill="#ffffff" stroke="#000AB5" stroke-width="3"/><rect x="164" y="100" width="6" height="40" fill="#FFA700"/>
<text x="150" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#000AB5"></text>
<!-- current heading (0 deg) -->
<line x1="170" y1="120" x2="232" y2="120" stroke="#8a90a0" stroke-width="4" stroke-dasharray="8 5"/>
<path d="M232,113 L246,120 L232,127 z" fill="#8a90a0"/>
<text x="252" y="116" font-size="13" fill="#16181d">current heading (0°)</text>
<!-- target heading arrow (-40 deg): dir (0.766, 0.643) in svg -->
<line x1="150" y1="120" x2="203.6" y2="165" stroke="#000AB5" stroke-width="5"/>
<path d="M199.2,171.6 L215,174.6 L208.2,160.4 z" fill="#000AB5"/>
<text x="106" y="196" font-size="13" font-weight="700" fill="#000AB5">target heading</text>
<text x="106" y="212" font-size="13" fill="#000AB5">= angle of toHub</text>
<!-- angle arc from 0 to -40 deg, radius 70 -->
<path d="M220,120 A70,70 0 0,1 203.6,165" fill="none" stroke="#FFA700" stroke-width="3"/>
<text x="226" y="148" font-size="14" font-weight="700" fill="#16181d">−40°</text>
<!-- driver translation arrow -->
<line x1="150" y1="100" x2="150" y2="72" stroke="#FFA700" stroke-width="5"/>
<path d="M143,74 L150,60 L157,74 z" fill="#FFA700"/>
<text x="162" y="74" font-size="13" fill="#16181d">driver's left stick still moves the robot</text>
<text x="150" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#000AB5"></text>
<text x="178" y="97" font-size="13" font-weight="700" fill="#000AB5">robot <tspan font-weight="400" fill="#16181d">(1.8, 6.4) m</tspan></text>
<text x="452" y="432" text-anchor="end" font-size="12.5" fill="#16181d">(part of the blue half; gold edge = robot front)</text>
<!-- right panel: the math -->
<rect x="500" y="56" width="360" height="384" rx="6" fill="#ffffff" stroke="#c9ced8" stroke-width="2"/>
<text x="516" y="84" font-size="15" font-weight="700" fill="#000AB5">The math, every loop (20 ms)</text>
<text x="516" y="114" font-size="14" font-weight="700" fill="#16181d">1. Vector from robot to hub</text>
<text x="530" y="134" font-size="13" fill="#16181d">toHub = hub − robot</text>
<text x="530" y="152" font-size="13" fill="#16181d">= (4.625 − 1.8, 4.035 − 6.4)</text>
<text x="530" y="170" font-size="13" fill="#16181d">= (2.83, −2.37) m</text>
<text x="516" y="200" font-size="14" font-weight="700" fill="#16181d">2. Its angle = target heading</text>
<text x="530" y="220" font-size="13" fill="#16181d">atan2(−2.37, 2.83) = −40°</text>
<text x="530" y="238" font-size="13" fill="#16181d">(Translation2d.getAngle() does this)</text>
<text x="516" y="268" font-size="14" font-weight="700" fill="#16181d">3. Heading error</text>
<text x="530" y="288" font-size="13" fill="#16181d">target − current = −40° − 0° = −40°</text>
<text x="530" y="306" font-size="13" fill="#16181d">negative → CTRE's heading PID</text>
<text x="530" y="324" font-size="13" fill="#16181d">turns the robot clockwise</text>
<text x="516" y="354" font-size="14" font-weight="700" fill="#16181d">On red</text>
<text x="530" y="374" font-size="13" fill="#16181d">same math with the red hub</text>
<text x="530" y="392" font-size="13" fill="#16181d">(11.915, 4.035) m</text>
<text x="516" y="424" font-size="12.5" fill="#16181d">Field angles: 0° = +X, counter-clockwise is +.</text>
</svg>
