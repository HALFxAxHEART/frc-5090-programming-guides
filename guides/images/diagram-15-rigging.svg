="#000AB5"/><rect x="478" y="367" width="84" height="8" fill="#000AB5"/><rect x="492" y="329" width="56" height="36" rx="3" fill="#FFA700" stroke="#16181d" stroke-width="1.2"/><rect x="640" y="150" width="10" height="230" fill="#c9ced8" stroke="#16181d" stroke-width="1.2"/><rect x="750" y="150" width="10" height="230" fill="#c9ced8" stroke="#16181d" stroke-width="1.2"/><rect x="658" y="80" width="10" height="220" fill="#000AB5"/><rect x="732" y="80" width="10" height="220" fill="#000AB5"/><rect x="658" y="292" width="84" height="8" fill="#000AB5"/><rect x="672" y="329" width="56" height="36" rx="3" fill="none" stroke="#16181d" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="672" y="179" width="56" height="36" rx="3" fill="#FFA700" stroke="#16181d" stroke-width="1.2"/><line x1="362" y1="347" x2="362" y2="207" stroke="#FFA700" stroke-width="4"/><path d="M354,209 L362,197 L370,209 z" fill="#FFA700"/><line x1="778" y1="375" x2="778" y2="310" stroke="#000AB5" stroke-width="4"/><path d="M770,312 L778,300 L786,312 z" fill="#000AB5"/><line x1="800" y1="347" x2="800" y2="207" stroke="#FFA700" stroke-width="4"/><path d="M792,209 L800,197 L808,209 z" fill="#FFA700"/><text x="100" y="404" text-anchor="middle" font-size="15" font-weight="400" fill="#16181d">at the bottom</text><text x="280" y="404" text-anchor="middle" font-size="15" font-weight="400" fill="#16181d">partway up</text><text x="520" y="404" text-anchor="middle" font-size="15" font-weight="400" fill="#16181d">at the bottom</text><text x="700" y="404" text-anchor="middle" font-size="15" font-weight="400" fill="#16181d">partway up</text><text x="280" y="428" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">carriage moved h</text><text x="280" y="448" text-anchor="middle" font-size="15" font-weight="400" fill="#16181d">stage 1 has not moved yet</text><text x="700" y="428" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">stage 1 moved d</text><text x="700" y="448" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">carriage moved 2d</text><text x="210" y="478" text-anchor="middle" font-size="14" font-weight="400" fill="#16181d">One cable runs through every stage.</text><text x="210" y="496" text-anchor="middle" font-size="14" font-weight="400" fill="#16181d">Carriage speed = cable speed.</text><text x="630" y="478" text-anchor="middle" font-size="14" font-weight="400" fill="#16181d">Each stage pulls the next; all move at once.</text><text x="630" y="496" text-anchor="middle" font-size="14" font-weight="400" fill="#16181d">Carriage speed = 2 x stage 1 speed.</text><rect x="60" y="519" width="22" height="16" fill="#c9ced8" stroke="#16181d"/><text x="90" y="532" text-anchor="start" font-size="14" font-weight="400" fill="#16181d">fixed base</text><rect x="210" y="519" width="22" height="16" fill="#000AB5"/><text x="240" y="532" text-anchor="start" font-size="14" font-weight="400" fill="#16181d">stage 1</text><rect x="340" y="519" width="22" height="16" fill="#FFA700" stroke="#16181d"/><text x="370" y="532" text-anchor="start" font-size="14" font-weight="400" fill="#16181d">carriage</text><rect x="480" y="519" width="22" height="16" fill="none" stroke="#16181d" stroke-dasharray="4 3"/><text x="510" y="532" text-anchor="start" font-size="14" font-weight="400" fill="#16181d">where the carriage started</text></svg>