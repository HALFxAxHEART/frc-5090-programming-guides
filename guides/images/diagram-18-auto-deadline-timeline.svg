<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" font-family="Inter, Arial, sans-serif" fill="#16181d">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16181d"/></marker></defs>
<rect width="900" height="410" fill="#fff"/>
<text x="450.0" y="30" text-anchor="middle" font-size="20" font-weight="700">"Left Double Swipe": a sequence of deadline groups</text>
<text x="105.5" y="60" text-anchor="middle" font-size="14" font-weight="700">Step 1</text>
<rect x="28" y="70" width="155" height="40" rx="6" fill="#000AB5" stroke="#000AB5" stroke-width="2"/>
<text x="105.5" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Left Swipe Out</text>
<rect x="28" y="118" width="155" height="40" rx="6" fill="#f4f5f9" stroke="#16181d" stroke-width="1.5"/>
<text x="105.5" y="144" text-anchor="middle" font-size="14">DriveIntake</text>
<line x1="187.0" y1="66" x2="187.0" y2="214" stroke="#FFA700" stroke-width="3"/>
<text x="271.0" y="60" text-anchor="middle" font-size="14" font-weight="700">Step 2</text>
<rect x="191" y="70" width="160" height="40" rx="6" fill="#000AB5" stroke="#000AB5" stroke-width="2"/>
<text x="271.0" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Left Bump Return</text>
<rect x="191" y="118" width="160" height="40" rx="6" fill="#f4f5f9" stroke="#16181d" stroke-width="1.5"/>
<text x="271.0" y="144" text-anchor="middle" font-size="14">DriveIntake</text>
<rect x="191" y="166" width="160" height="40" rx="6" fill="#f4f5f9" stroke="#16181d" stroke-width="1.5"/>
<text x="271.0" y="192" text-anchor="middle" font-size="14">SpinUp</text>
<line x1="355.0" y1="66" x2="355.0" y2="214" stroke="#FFA700" stroke-width="3"/>
<text x="411.5" y="60" text-anchor="middle" font-size="14" font-weight="700">Step 3</text>
<rect x="359" y="70" width="105" height="40" rx="6" fill="#000AB5" stroke="#000AB5" stroke-width="2"/>
<text x="411.5" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">wait 0.25 s</text>
<rect x="359" y="118" width="105" height="40" rx="6" fill="#f4f5f9" stroke="#16181d" stroke-width="1.5"/>
<text x="411.5" y="144" text-anchor="middle" font-size="14">DriveIntake</text>
<rect x="359" y="166" width="105" height="40" rx="6" fill="#f4f5f9" stroke="#16181d" stroke-width="1.5"/>
<text x="411.5" y="192" text-anchor="middle" font-size="14">SpinUp</text>
<line x1="468.0" y1="66" x2="468.0" y2="214" stroke="#FFA700" stroke-width="3"/>
<text x="549.5" y="60" text-anchor="middle" font-size="14" font-weight="700">Step 4</text>
<rect x="472" y="70" width="155" height="40" rx="6" fill="#000AB5" stroke="#000AB5" stroke-width="2"/>
<text x="549.5" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Left Shoot Walk</text>
<rect x="472" y="118" width="155" height="40" rx="6" fill="#f4f5f9" stroke="#16181d" stroke-width="1.5"/>
<text x="549.5" y="144" text-anchor="middle" font-size="14">ShootOnMove</text>
<rect x="472" y="166" width="155" height="40" rx="6" fill="#f4f5f9" stroke="#16181d" stroke-width="1.5"/>
<text x="549.5" y="192" text-anchor="middle" font-size="14">IntakeAgitate</text>
<line x1="631.0" y1="66" x2="631.0" y2="214" stroke="#FFA700" stroke-width="3"/>
<rect x="635" y="70" width="80" height="136" rx="6" fill="#fff" stroke="#c9ced8" stroke-width="2" stroke-dasharray="6 5"/>
<text x="675.0" y="112" text-anchor="middle" font-size="14">steps</text>
<text x="675.0" y="132" text-anchor="middle" font-size="14">1 to 4</text>
<text x="675.0" y="152" text-anchor="middle" font-size="14">again</text>
<text x="675.0" y="172" text-anchor="middle" font-size="14">(5 to 8)</text>
<text x="793.0" y="60" text-anchor="middle" font-size="14" font-weight="700">Step 9</text>
<rect x="723" y="70" width="140" height="40" rx="6" fill="#000AB5" stroke="#000AB5" stroke-width="2"/>
<text x="793.0" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Left Trench Exit</text>
<rect x="723" y="118" width="140" height="40" rx="6" fill="#f4f5f9" stroke="#16181d" stroke-width="1.5"/>
<text x="793.0" y="144" text-anchor="middle" font-size="14">DriveIntake</text>
<line x1="867.0" y1="66" x2="867.0" y2="214" stroke="#FFA700" stroke-width="3"/>
<line x1="28" y1="236" x2="872" y2="236" stroke="#16181d" stroke-width="2" marker-end="url(#ah)"/>
<text x="870" y="258" text-anchor="end" font-size="14">time (box widths not to scale)</text>
<rect x="40" y="286" width="34" height="22" rx="4" fill="#000AB5"/>
<text x="84" y="302" font-size="14"><tspan font-weight="700">Deadline</tspan> (a path or a wait). It ends on its own, and that ends the whole group.</text>
<rect x="40" y="320" width="34" height="22" rx="4" fill="#f4f5f9" stroke="#16181d" stroke-width="1.5"/>
<text x="84" y="336" font-size="14"><tspan font-weight="700">Named commands</tspan> that never end on their own. They run alongside the deadline and get cancelled with it.</text>
<line x1="57" y1="354" x2="57" y2="380" stroke="#FFA700" stroke-width="3"/>
<text x="84" y="372" font-size="14"><tspan font-weight="700">Deadline ends</tspan>: the other commands in that step are cancelled and the next step starts.</text>
</svg>