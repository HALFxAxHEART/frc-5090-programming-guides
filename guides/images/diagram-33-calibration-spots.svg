<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000AB5"/>
    </marker>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16181d"/>
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16181d"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="700" fill="#16181d">Generic field, top view: where to place the robot during calibration time (not to scale)</text>

  <!-- field outline -->
  <rect x="80" y="60" width="720" height="350" fill="#f4f5f9" stroke="#16181d" stroke-width="3"/>
  <!-- alliance walls -->
  <rect x="62" y="60" width="18" height="350" fill="#000AB5"/>
  <rect x="800" y="60" width="18" height="350" fill="#c9ced8" stroke="#16181d"/>
  <text x="50" y="235" font-size="14" font-weight="700" fill="#000AB5" text-anchor="middle" transform="rotate(-90 50 235)">BLUE alliance wall</text>
  <text x="836" y="235" font-size="14" font-weight="700" fill="#16181d" text-anchor="middle" transform="rotate(90 836 235)">RED alliance wall</text>
  <!-- center line -->
  <line x1="440" y1="60" x2="440" y2="410" stroke="#c9ced8" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- tags on alliance walls -->
  <rect x="80" y="120" width="10" height="16" fill="#16181d"/>
  <rect x="80" y="330" width="10" height="16" fill="#16181d"/>
  <rect x="790" y="120" width="10" height="16" fill="#16181d"/>
  <rect x="790" y="330" width="10" height="16" fill="#16181d"/>
  <!-- field elements with tags -->
  <rect x="265" y="195" width="60" height="80" rx="4" fill="#ffffff" stroke="#16181d" stroke-width="2"/>
  <rect x="255" y="227" width="10" height="16" fill="#16181d"/>
  <text x="295" y="290" text-anchor="middle" font-size="13" fill="#16181d">element</text>
  <rect x="555" y="195" width="60" height="80" rx="4" fill="#ffffff" stroke="#16181d" stroke-width="2"/>
  <rect x="615" y="227" width="10" height="16" fill="#16181d"/>
  <text x="585" y="290" text-anchor="middle" font-size="13" fill="#16181d">element</text>

  <!-- spot A: auto start, against starting line -->
  <rect x="200" y="100" width="36" height="36" rx="4" fill="#FFA700" stroke="#16181d" stroke-width="2"/>
  <text x="218" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">A</text>
  <line x1="200" y1="118" x2="172" y2="118" stroke="#000AB5" stroke-width="3" marker-end="url(#arr)"/>

  <!-- spot B: 1.5 m in front of tag on element -->
  <rect x="195" y="217" width="36" height="36" rx="4" fill="#FFA700" stroke="#16181d" stroke-width="2"/>
  <text x="213" y="241" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">B</text>
  <line x1="231" y1="235" x2="252" y2="235" stroke="#000AB5" stroke-width="3" marker-end="url(#arr)"/>

  <!-- spot C: 3 m at an angle -->
  <rect x="150" y="320" width="36" height="36" rx="4" fill="#FFA700" stroke="#16181d" stroke-width="2"/>
  <text x="168" y="344" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">C</text>
  <line x1="186" y1="328" x2="215" y2="306" stroke="#000AB5" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="186" y1="330" x2="255" y2="240" stroke="#16181d" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- spot D: far, find dropout -->
  <rect x="395" y="150" width="36" height="36" rx="4" fill="#FFA700" stroke="#16181d" stroke-width="2"/>
  <text x="413" y="174" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">D</text>
  <line x1="395" y1="168" x2="367" y2="168" stroke="#000AB5" stroke-width="3" marker-end="url(#arr)"/>

  <!-- spot E: red side mirror of A -->
  <rect x="644" y="334" width="36" height="36" rx="4" fill="#FFA700" stroke="#16181d" stroke-width="2"/>
  <text x="662" y="358" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">E</text>
  <line x1="680" y1="352" x2="708" y2="352" stroke="#000AB5" stroke-width="3" marker-end="url(#arr)"/>

  <!-- spot F: red side, in front of tag -->
  <rect x="649" y="217" width="36" height="36" rx="4" fill="#FFA700" stroke="#16181d" stroke-width="2"/>
  <text x="667" y="241" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">F</text>
  <line x1="649" y1="235" x2="628" y2="235" stroke="#000AB5" stroke-width="3" marker-end="url(#arr)"/>

  <!-- origin + axes -->
  <circle cx="80" cy="410" r="5" fill="#16181d"/>
  <text x="92" y="400" font-size="13" font-weight="700" fill="#16181d">(0, 0)</text>
  <line x1="80" y1="440" x2="150" y2="440" stroke="#16181d" stroke-width="2" marker-end="url(#ink)"/>
  <text x="156" y="445" font-size="13" fill="#16181d">+x (toward red)</text>
  <line x1="300" y1="455" x2="300" y2="420" stroke="#16181d" stroke-width="2" marker-end="url(#ink)"/>
  <text x="308" y="445" font-size="13" fill="#16181d">+y (left, from the blue drivers)</text>
  <text x="560" y="445" font-size="13" fill="#16181d">heading 0 deg = facing the red wall</text>

  <!-- legend -->
  <rect x="80" y="465" width="12" height="18" fill="#16181d"/>
  <text x="98" y="479" font-size="13" fill="#16181d">AprilTag</text>
  <rect x="170" y="465" width="18" height="18" rx="3" fill="#FFA700" stroke="#16181d"/>
  <text x="194" y="479" font-size="13" fill="#16181d">robot spot (arrow = the way the camera looks)</text>
  <text x="80" y="505" font-size="13" fill="#16181d">A/E: real auto start poses.  B/F: about 1.5 m, facing a tag.  C: about 3 m, at an angle.  D: walk back until tags drop out.</text>
</svg>
