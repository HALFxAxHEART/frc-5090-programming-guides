<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000AB5"/>
    </marker>
  </defs>

  <!-- region labels -->
  <rect x="15" y="15" width="535" height="215" rx="14" fill="none" stroke="#c9ced8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="32" y="40" font-size="14" font-weight="700" fill="#16181d">Inside the Limelight (every frame)</text>
  <rect x="570" y="15" width="315" height="400" rx="14" fill="none" stroke="#c9ced8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="587" y="40" font-size="14" font-weight="700" fill="#16181d">Our robot code (every 20 ms)</text>

  <!-- 1 image -->
  <rect x="30" y="60" width="140" height="150" rx="10" fill="#f4f5f9" stroke="#000AB5" stroke-width="2.5"/>
  <text x="100" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#000AB5">1. Image</text>
  <rect x="48" y="96" width="104" height="72" fill="#ffffff" stroke="#16181d" stroke-width="1.5"/>
  <circle cx="75" cy="145" r="10" fill="#c9ced8" stroke="#16181d"/>
  <circle cx="120" cy="125" r="7" fill="#c9ced8" stroke="#16181d"/>
  <circle cx="134" cy="152" r="12" fill="#c9ced8" stroke="#16181d"/>
  <text x="100" y="192" text-anchor="middle" font-size="13" fill="#16181d">camera frame</text>

  <!-- 2 network -->
  <rect x="200" y="60" width="150" height="150" rx="10" fill="#f4f5f9" stroke="#000AB5" stroke-width="2.5"/>
  <text x="275" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#000AB5">2. Neural net</text>
  <text x="275" y="110" text-anchor="middle" font-size="13" fill="#16181d">the trained model</text>
  <text x="275" y="128" text-anchor="middle" font-size="13" fill="#16181d">runs on the Hailo,</text>
  <text x="275" y="146" text-anchor="middle" font-size="13" fill="#16181d">Coral or CPU</text>
  <text x="275" y="172" text-anchor="middle" font-size="13" fill="#16181d">"I think there's a</text>
  <text x="275" y="190" text-anchor="middle" font-size="13" fill="#16181d">fuel here, 87% sure"</text>

  <!-- 3 detections -->
  <rect x="380" y="60" width="155" height="150" rx="10" fill="#f4f5f9" stroke="#000AB5" stroke-width="2.5"/>
  <text x="457" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#000AB5">3. Detections</text>
  <text x="457" y="108" text-anchor="middle" font-size="13" fill="#16181d">drop if below the</text>
  <text x="457" y="126" text-anchor="middle" font-size="13" fill="#16181d">confidence threshold</text>
  <text x="457" y="144" text-anchor="middle" font-size="13" fill="#16181d">or wrong class</text>
  <text x="457" y="170" text-anchor="middle" font-size="13" fill="#16181d">publish to NT:</text>
  <text x="457" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#16181d">tv tx ty ta tdclass</text>
  <text x="457" y="204" text-anchor="middle" font-size="13" font-weight="700" fill="#16181d">rawdetections</text>

  <line x1="170" y1="135" x2="195" y2="135" stroke="#000AB5" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="350" y1="135" x2="375" y2="135" stroke="#000AB5" stroke-width="3" marker-end="url(#arr)"/>

  <!-- NT arrow to robot -->
  <line x1="535" y1="135" x2="600" y2="100" stroke="#000AB5" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 4 filter -->
  <rect x="605" y="60" width="245" height="110" rx="10" fill="#f4f5f9" stroke="#000AB5" stroke-width="2.5"/>
  <text x="727" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#000AB5">4. Pick a target</text>
  <text x="727" y="108" text-anchor="middle" font-size="13" fill="#16181d">ignore tiny / far pieces</text>
  <text x="727" y="126" text-anchor="middle" font-size="13" fill="#16181d">choose the closest</text>
  <text x="727" y="144" text-anchor="middle" font-size="13" fill="#16181d">debounce: seen for 0.1 s?</text>

  <!-- 5 command -->
  <rect x="605" y="200" width="245" height="100" rx="10" fill="#FFA700" stroke="#16181d" stroke-width="2"/>
  <text x="727" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">5. Intake down: robot turns</text>
  <text x="727" y="250" text-anchor="middle" font-size="13" fill="#16181d">rotation: rate = -kP x tx</text>
  <text x="727" y="270" text-anchor="middle" font-size="13" fill="#16181d">translation: driver's left stick</text>
  <text x="727" y="290" text-anchor="middle" font-size="13" fill="#16181d">no target: driver's right stick</text>

  <!-- 6 stop -->
  <rect x="605" y="330" width="245" height="70" rx="10" fill="#f4f5f9" stroke="#000AB5" stroke-width="2.5"/>
  <text x="727" y="356" text-anchor="middle" font-size="15" font-weight="700" fill="#000AB5">6. Stop</text>
  <text x="727" y="380" text-anchor="middle" font-size="13" fill="#16181d">CANrange sees the piece in the intake</text>

  <line x1="727" y1="170" x2="727" y2="195" stroke="#000AB5" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="727" y1="300" x2="727" y2="325" stroke="#000AB5" stroke-width="3" marker-end="url(#arr)"/>

  <!-- lost target loop -->
  <path d="M850,250 L870,250 L870,115 L855,115" fill="none" stroke="#000AB5" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>

  <!-- note box -->
  <rect x="30" y="260" width="520" height="140" rx="10" fill="#ffffff" stroke="#c9ced8" stroke-width="2"/>
  <text x="48" y="288" font-size="14" font-weight="700" fill="#16181d">What the camera does NOT tell you</text>
  <text x="48" y="314" font-size="13" fill="#16181d">- Where the piece is on the field (only angles and size in the image)</text>
  <text x="48" y="336" font-size="13" fill="#16181d">- Whether it's reachable, or on the other side of a wall</text>
  <text x="48" y="358" font-size="13" fill="#16181d">- That a "detection" is real: the network can be wrong</text>
  <text x="48" y="380" font-size="13" fill="#16181d">Steps 4 to 6 are our job, in code. Dashed arrow: target lost, pick again.</text>
  
</svg>
