<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000AB5"/>
    </marker>
  </defs>

  <line x1="320" y1="20" x2="320" y2="390" stroke="#c9ced8" stroke-width="1.5"/>
  <line x1="640" y1="20" x2="640" y2="390" stroke="#c9ced8" stroke-width="1.5"/>

  <!-- PANEL 1: SHOOT -->
  <text x="160" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#000AB5">Shoot: atTag, offset 0</text>
  <rect x="100" y="150" width="20" height="100" fill="#16181d"/>
  <text x="78" y="205" text-anchor="end" font-size="11" fill="#16181d">tag</text>
  <line x1="120" y1="200" x2="195" y2="200" stroke="#000AB5" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="195" y="178" width="55" height="44" rx="5" fill="#f4f5f9" stroke="#000AB5" stroke-width="3"/>
  <text x="222" y="204" text-anchor="middle" font-size="10" fill="#16181d">robot</text>
  <line x1="222" y1="178" x2="222" y2="140" stroke="#000AB5" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="160" y="270" text-anchor="middle" font-size="12" fill="#16181d">centered on the tag,</text>
  <text x="160" y="288" text-anchor="middle" font-size="12" fill="#16181d">fixed standoff distance</text>
  <text x="160" y="320" text-anchor="middle" font-size="11" fill="#16181d">real code: kHub</text>
  <text x="160" y="337" text-anchor="middle" font-size="11" fill="#16181d">(sections 3, 7)</text>

  <!-- PANEL 2: REEF -->
  <text x="480" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#000AB5">Reef: atTag, two offsets</text>
  <rect x="420" y="150" width="20" height="100" fill="#16181d"/>
  <text x="398" y="205" text-anchor="end" font-size="11" fill="#16181d">tag</text>
  <line x1="440" y1="170" x2="505" y2="170" stroke="#FFA700" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="505" y="148" width="55" height="44" rx="5" fill="#f4f5f9" stroke="#FFA700" stroke-width="3"/>
  <text x="532" y="174" text-anchor="middle" font-size="9" fill="#16181d">left</text>
  <line x1="440" y1="230" x2="505" y2="230" stroke="#b97a00" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="505" y="208" width="55" height="44" rx="5" fill="#f4f5f9" stroke="#b97a00" stroke-width="3"/>
  <text x="532" y="234" text-anchor="middle" font-size="9" fill="#16181d">right</text>
  <text x="480" y="270" text-anchor="middle" font-size="12" fill="#16181d">+/- sideOffsetM picks</text>
  <text x="480" y="288" text-anchor="middle" font-size="12" fill="#16181d">the branch; driver picks</text>
  <text x="480" y="306" text-anchor="middle" font-size="12" fill="#16181d">which with 2 buttons</text>
  <text x="480" y="337" text-anchor="middle" font-size="11" fill="#16181d">scoring height: guide 26</text>

  <!-- PANEL 3: CLIMB -->
  <text x="800" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#000AB5">Climb: atPosition, tight</text>
  <rect x="740" y="140" width="120" height="30" fill="none" stroke="#16181d" stroke-width="3"/>
  <text x="800" y="128" text-anchor="middle" font-size="11" fill="#16181d">climb structure (no tag)</text>
  <line x1="800" y1="170" x2="800" y2="215" stroke="#000AB5" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="772" y="215" width="56" height="44" rx="5" fill="#f4f5f9" stroke="#000AB5" stroke-width="3"/>
  <text x="800" y="241" text-anchor="middle" font-size="10" fill="#16181d">robot</text>
  <text x="800" y="290" text-anchor="middle" font-size="12" fill="#16181d">fixed x/y/heading,</text>
  <text x="800" y="308" text-anchor="middle" font-size="12" fill="#16181d">measured by hand</text>
  <text x="800" y="337" text-anchor="middle" font-size="11" fill="#16181d">tighter tolerance + a</text>
  <text x="800" y="353" text-anchor="middle" font-size="11" fill="#16181d">stricter stuck/timeout check</text>

  <text x="480" y="400" text-anchor="middle" font-size="12" fill="#16181d">Same FieldTarget / TargetGroup pattern, three different jobs. Only "Shoot" (kHub) is code that has actually run on our robot.</text>
</svg>
