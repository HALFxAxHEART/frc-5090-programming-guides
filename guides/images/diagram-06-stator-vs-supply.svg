<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000AB5"/>
    </marker>
  </defs>
  <rect width="880" height="480" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#16181d">Two currents: where each one flows</text>

  <!-- chain -->
  <g font-size="13" fill="#16181d" text-anchor="middle">
    <rect x="20" y="70" width="120" height="76" rx="8" fill="#f4f5f9" stroke="#16181d" stroke-width="2"/>
    <text x="80" y="102" font-size="15" font-weight="700">Battery</text>
    <text x="80" y="122">about 12–13 V</text>

    <rect x="180" y="70" width="130" height="76" rx="8" fill="#f4f5f9" stroke="#16181d" stroke-width="2"/>
    <text x="245" y="96" font-size="15" font-weight="700">Main breaker</text>
    <text x="245" y="116">120 A</text>
    <text x="245" y="134">(whole robot)</text>

    <rect x="350" y="70" width="140" height="76" rx="8" fill="#f4f5f9" stroke="#16181d" stroke-width="2"/>
    <text x="420" y="96" font-size="15" font-weight="700">PDH (ID 1)</text>
    <text x="420" y="116">40 A breaker</text>
    <text x="420" y="134">per big motor</text>

    <rect x="530" y="70" width="140" height="76" rx="8" fill="#000AB5"/>
    <text x="600" y="102" font-size="15" font-weight="700" fill="#fff">Talon</text>
    <text x="600" y="122" fill="#fff">(FX or FXS)</text>

    <rect x="740" y="70" width="120" height="76" rx="8" fill="#FFA700" stroke="#16181d" stroke-width="1.5"/>
    <text x="800" y="102" font-size="15" font-weight="700">Motor</text>
    <text x="800" y="122">coils</text>
  </g>
  <g stroke="#000AB5" stroke-width="3">
    <line x1="140" y1="108" x2="176" y2="108" marker-end="url(#a)"/>
    <line x1="310" y1="108" x2="346" y2="108" marker-end="url(#a)"/>
    <line x1="490" y1="108" x2="526" y2="108" marker-end="url(#a)"/>
    <line x1="670" y1="108" x2="736" y2="108" marker-end="url(#a)"/>
  </g>

  <!-- brackets -->
  <path d="M20,160 L20,172 L670,172 L670,160" fill="none" stroke="#000AB5" stroke-width="2.5"/>
  <text x="345" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#000AB5">SUPPLY current</text>
  <text x="345" y="215" text-anchor="middle" font-size="13" fill="#16181d">battery side: what the battery, wires and breakers feel (brownouts, trips)</text>

  <path d="M680,160 L680,172 L860,172 L860,160" fill="none" stroke="#16181d" stroke-width="2.5"/>
  <text x="770" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">STATOR current</text>
  <text x="770" y="215" text-anchor="middle" font-size="13" fill="#16181d">in the coils:</text>
  <text x="770" y="232" text-anchor="middle" font-size="13" fill="#16181d">torque and heat</text>

  <!-- comparison bars -->
  <line x1="20" y1="256" x2="860" y2="256" stroke="#c9ced8" stroke-width="1.5"/>
  <text x="440" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">supply ≈ stator × duty cycle</text>

  <g font-size="13" fill="#16181d">
    <text x="210" y="306" text-anchor="middle" font-weight="700">Pushing a wall at 0.2 duty</text>
    <rect x="140" y="342" width="60" height="108" fill="#FFA700" stroke="#16181d" stroke-width="1.5"/>
    <rect x="220" y="428" width="60" height="22" fill="#000AB5"/>
    <text x="170" y="336" text-anchor="middle" font-weight="700">60 A</text>
    <text x="250" y="422" text-anchor="middle" font-weight="700">12 A</text>
    <text x="170" y="466" text-anchor="middle">stator</text>
    <text x="250" y="466" text-anchor="middle">supply</text>

    <text x="330" y="350">Low speed (starting, stalled, pushing):</text>
    <text x="330" y="368">stator is high, supply is low.</text>
    <text x="330" y="386" font-weight="700">The stator limit matters most.</text>
    <text x="330" y="412">High speed: supply ≈ stator.</text>
    <text x="330" y="430" font-weight="700">The supply limit matters most.</text>

    <text x="730" y="306" text-anchor="middle" font-weight="700">High speed, duty near 1</text>
    <rect x="660" y="360" width="60" height="90" fill="#FFA700" stroke="#16181d" stroke-width="1.5"/>
    <rect x="740" y="360" width="60" height="90" fill="#000AB5"/>
    <text x="730" y="350" text-anchor="middle" font-weight="700">about equal</text>
    <text x="690" y="466" text-anchor="middle">stator</text>
    <text x="770" y="466" text-anchor="middle">supply</text>
  </g>
  <line x1="130" y1="450" x2="290" y2="450" stroke="#16181d" stroke-width="1.5"/>
  <line x1="650" y1="450" x2="810" y2="450" stroke="#16181d" stroke-width="1.5"/>
</svg>
