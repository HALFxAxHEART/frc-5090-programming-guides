<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="Inter, Arial, sans-serif">
<rect width="880" height="460" fill="#ffffff"/>
<line x1="440" y1="16" x2="440" y2="440" stroke="#c9ced8" stroke-width="2"/>
<text x="220" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#000AB5">Top view: forward, side, yaw</text><text x="660" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#000AB5">Side view: up and pitch</text><rect x="120" y="145" width="200" height="200" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="3"/><text x="220" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#16181d">FRONT  (yaw 0)</text><text x="110" y="250" text-anchor="end" font-size="14" font-weight="700" fill="#16181d">+90</text><text x="110" y="268" text-anchor="end" font-size="13" font-weight="400" fill="#16181d">(left)</text><text x="330" y="250" text-anchor="start" font-size="14" font-weight="700" fill="#16181d">−90</text><text x="330" y="268" text-anchor="start" font-size="13" font-weight="400" fill="#16181d">(right)</text><text x="220" y="371" text-anchor="middle" font-size="14" font-weight="700" fill="#16181d">180  (back)</text><path d="M127.7,126.8 A150 150 0 0 0 77.3,198.6" fill="none" stroke="#FFA700" stroke-width="3"/><path d="M73.72659131275365,184.85534179152893 L76.72348856697708,200.54956387634817 L88.37286166369903,189.61420350490312 z" fill="#FFA700"/><text x="119.65077870115125" y="120.7983869589917" text-anchor="end" font-size="13" font-weight="700" fill="#16181d">+ yaw</text><line x1="220" y1="245" x2="220" y2="168" stroke="#000AB5" stroke-width="3"/><path d="M225.5,169 L220,159 L214.5,169 z" fill="#000AB5"/><text x="212" y="175" text-anchor="end" font-size="13" font-weight="700" fill="#000AB5">+forward</text><line x1="143" y1="245" x2="297" y2="245" stroke="#16181d" stroke-width="2"/><path d="M296,250.5 L306,245 L296,239.5 z" fill="#16181d"/><path d="M144,239.5 L134,245 L144,250.5 z" fill="#16181d"/><text x="220" y="285" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">side (which sign is left?</text><text x="220" y="302" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">test it: see the warning)</text><circle cx="220" cy="245" r="5" fill="#16181d"/><line x1="270" y1="182.5" x2="270" y2="245" stroke="#16181d" stroke-dasharray="4 3"/><line x1="270" y1="182.5" x2="220" y2="182.5" stroke="#16181d" stroke-dasharray="4 3"/><rect x="256" y="173.5" width="28" height="18" rx="3" fill="#FFA700" stroke="#16181d" stroke-width="1.5"/><text x="273" y="167.5" text-anchor="middle" font-size="13" font-weight="700" fill="#16181d">camera</text><text x="226" y="212.5" text-anchor="start" font-size="13" font-weight="400" fill="#16181d">0.25 m</text><text x="245" y="237" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">0.20 m</text><line x1="465" y1="380" x2="860" y2="380" stroke="#16181d" stroke-width="2.5"/><text x="470" y="402" text-anchor="start" font-size="13" font-weight="400" fill="#16181d">carpet</text><rect x="520" y="318" width="200" height="44" rx="5" fill="#f4f5f9" stroke="#000AB5" stroke-width="3"/><circle cx="555" cy="366" r="13" fill="#16181d"/><circle cx="685" cy="366" r="13" fill="#16181d"/><text x="728" y="344" text-anchor="start" font-size="13" font-weight="700" fill="#16181d">FRONT</text><rect x="679.5" y="305" width="6" height="13" fill="#16181d"/><g transform="translate(682.5 305) rotate(-20)"><rect x="-16" y="-10" width="32" height="20" rx="3" fill="#FFA700" stroke="#16181d" stroke-width="1.5"/></g><line x1="682.5" y1="305" x2="823.4538931178863" y2="253.6969785011497" stroke="#FFA700" stroke-width="2.5" stroke-dasharray="7 5"/><line x1="682.5" y1="305" x2="832.5" y2="305" stroke="#16181d" stroke-width="1.2" stroke-dasharray="3 4"/><text x="662.5" y="225" text-anchor="start" font-size="13" font-weight="700" fill="#16181d">+pitch = tilted up</text><text x="662.5" y="243" text-anchor="start" font-size="13" font-weight="400" fill="#16181d">(down is −)</text><line x1="490" y1="371" x2="490" y2="314" stroke="#000AB5" stroke-width="2.5"/><path d="M495.5,315 L490,305 L484.5,315 z" fill="#000AB5"/><path d="M484.5,370 L490,380 L495.5,370 z" fill="#000AB5"/><line x1="490" y1="305" x2="664.5" y2="305" stroke="#16181d" stroke-dasharray="3 3"/><text x="482" y="340.5" text-anchor="end" font-size="13" font-weight="700" fill="#000AB5">up</text><text x="482" y="358.5" text-anchor="end" font-size="13" font-weight="400" fill="#16181d">(lens height)</text><circle cx="620" cy="380" r="5" fill="#16181d"/><text x="620" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#16181d">origin: robot center, on the floor</text><line x1="620" y1="394" x2="673.5" y2="394" stroke="#000AB5" stroke-width="2"/><path d="M672.5,399.5 L682.5,394 L672.5,388.5 z" fill="#000AB5"/><text x="651.25" y="376" text-anchor="middle" font-size="14" font-weight="400" fill="#16181d"></text><text x="690.5" y="399" text-anchor="start" font-size="13" font-weight="700" fill="#000AB5">forward</text><text x="660" y="62" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">roll (not shown) = tilted sideways, usually 0</text><text x="220" y="430" text-anchor="middle" font-size="13" font-weight="400" fill="#16181d">All lengths in meters, angles in degrees</text></svg>