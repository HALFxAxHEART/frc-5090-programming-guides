<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 665" width="900" height="665" font-family="Inter, Arial, sans-serif" fill="#16181d">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000AB5"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c07d00"/>
    </marker>
  </defs>
  <rect width="900" height="665" fill="#fff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="700">What talks to what: laptop tools and the robot</text>

  <!-- LAPTOP -->
  <rect x="20" y="55" width="355" height="500" rx="10" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/>
  <text x="197" y="82" text-anchor="middle" font-size="16" font-weight="700">Laptop (Windows)</text>
  <text x="40" y="108" font-size="13" font-weight="700" fill="#555">Tool</text>
  <text x="200" y="108" font-size="13" font-weight="700" fill="#555">Talks to</text>
  <line x1="36" y1="116" x2="360" y2="116" stroke="#c9ced8"/>

  <g font-size="14">
    <text x="40" y="142" font-weight="700">Driver Station</text>
    <text x="200" y="142">roboRIO: enable,</text>
    <text x="200" y="159">joysticks, battery</text>

    <text x="40" y="190" font-weight="700">VS Code (WPILib)</text>
    <text x="200" y="190">roboRIO: deploy</text>
    <text x="200" y="207">code (over SSH)</text>

    <text x="40" y="238" font-weight="700">Elastic dashboard</text>
    <text x="40" y="256" font-weight="700">AdvantageScope</text>
    <text x="40" y="274" font-weight="700">PathPlanner</text>
    <text x="200" y="247">roboRIO:</text>
    <text x="200" y="264">NetworkTables</text>
    <text x="200" y="281">(port 5810)</text>

    <text x="40" y="312" font-weight="700">Phoenix Tuner X</text>
    <text x="200" y="312">roboRIO: Phoenix</text>
    <text x="200" y="329">diag. server (1250)</text>

    <text x="40" y="360" font-weight="700">Web browser</text>
    <text x="200" y="360">radio page, roboRIO</text>
    <text x="200" y="377">page, Limelight :5801</text>

    <text x="40" y="408" font-weight="700">Limelight</text>
    <text x="40" y="425" font-weight="700">Hardware Manager</text>
    <text x="200" y="408">Limelight: find it,</text>
    <text x="200" y="425">flash LLOS (USB)</text>

    <text x="40" y="456" font-weight="700">Git /</text>
    <text x="40" y="473" font-weight="700">GitHub Desktop</text>
    <text x="200" y="456">GitHub (internet),</text>
    <text x="200" y="473">never the robot</text>

    <text x="40" y="504" font-weight="700">REV Hardware</text>
    <text x="40" y="521" font-weight="700">Client 2</text>
    <text x="200" y="504">REV PDH: firmware,</text>
    <text x="200" y="521">status (USB-C cable)</text>
  </g>

  <!-- link laptop -> radio -->
  <line x1="377" y1="230" x2="483" y2="230" stroke="#000AB5" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="420" y="212" text-anchor="middle" font-size="13" font-weight="700">Ethernet</text>
  <text x="420" y="255" text-anchor="middle" font-size="13" font-weight="700">or Wi-Fi</text>

  <!-- USB fallback -->
  <path d="M377,125 H611" fill="none" stroke="#c07d00" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ahg)"/>
  <text x="480" y="115" font-size="13" fill="#7a4f00" font-weight="700">USB: 172.22.11.2</text>

  <!-- ROBOT -->
  <rect x="470" y="55" width="415" height="500" rx="12" fill="none" stroke="#16181d" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="865" y="80" text-anchor="end" font-size="15" font-weight="700">ROBOT</text>

  <!-- radio -->
  <rect x="485" y="150" width="112" height="150" rx="8" fill="#000AB5"/>
  <text x="541" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">VH-109</text>
  <text x="541" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">radio</text>
  <text x="541" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#FFA700">10.50.90.1</text>
  <text x="541" y="256" text-anchor="middle" font-size="13" fill="#fff">setup page</text>
  <text x="541" y="273" text-anchor="middle" font-size="13" fill="#fff">192.168.69.1</text>

  <!-- roboRIO -->
  <rect x="610" y="100" width="255" height="120" rx="8" fill="#fff" stroke="#000AB5" stroke-width="2.5"/>
  <text x="737" y="124" text-anchor="middle" font-size="16" font-weight="700">roboRIO  10.50.90.2</text>
  <text x="625" y="148" font-size="13">runs OUR robot code</text>
  <text x="625" y="166" font-size="13">NetworkTables server</text>
  <text x="625" y="184" font-size="13">Phoenix diagnostic server</text>
  <text x="625" y="202" font-size="13">web page (roboRIO-5090-FRC.local)</text>
  <line x1="597" y1="175" x2="610" y2="175" stroke="#000AB5" stroke-width="3"/>

  <!-- limelight -->
  <rect x="610" y="240" width="255" height="62" rx="8" fill="#fff" stroke="#000AB5" stroke-width="2.5"/>
  <text x="737" y="264" text-anchor="middle" font-size="15" font-weight="700">Limelight  10.50.90.11</text>
  <text x="737" y="287" text-anchor="middle" font-size="13">web UI :5801, sends tags via NT</text>
  <line x1="597" y1="270" x2="610" y2="270" stroke="#000AB5" stroke-width="3"/>

  <!-- CAN -->
  <rect x="610" y="330" width="255" height="160" rx="8" fill="#fff7e6" stroke="#FFA700" stroke-width="2.5"/>
  <text x="737" y="358" text-anchor="middle" font-size="15" font-weight="700">CAN buses (yellow/green wire)</text>
  <text x="625" y="382" font-size="13">"rio" bus, and CANivores on USB:</text>
  <text x="625" y="402" font-size="13" font-weight="700">Jarvis: swerve motors, CANcoders,</text>
  <text x="625" y="419" font-size="13" font-weight="700">  Pigeon 2</text>
  <text x="625" y="439" font-size="13" font-weight="700">Upper: mechanism motors</text>
  <text x="625" y="463" font-size="13">No IP address: reached only</text>
  <text x="625" y="478" font-size="13" dy="0">through the roboRIO (or CANivore USB)</text>
  <!-- rio to CAN connector -->
  <path d="M865,160 h10 v245 h-8" fill="none" stroke="#FFA700" stroke-width="3" marker-end="url(#ahg)"/>

  <!-- PDH -->
  <rect x="610" y="500" width="255" height="42" rx="8" fill="#fff" stroke="#000AB5" stroke-width="2"/>
  <text x="737" y="526" text-anchor="middle" font-size="14" font-weight="700">REV PDH (power, CAN ID 1)</text>
  <path d="M377,516 H608" fill="none" stroke="#c07d00" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ahg)"/>
  <text x="423" y="507" text-anchor="middle" font-size="13" fill="#7a4f00" font-weight="700">USB-C</text>

  <!-- legend -->
  <rect x="20" y="570" width="865" height="78" rx="8" fill="#f4f5f9" stroke="#c9ced8"/>
  <line x1="36" y1="592" x2="76" y2="592" stroke="#000AB5" stroke-width="4"/>
  <text x="86" y="597" font-size="13">Robot network 10.50.90.x: everything with an IP address goes through the radio.</text>
  <line x1="36" y1="616" x2="76" y2="616" stroke="#c07d00" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="86" y="621" font-size="13">USB: roboRIO fallback when the network is broken (Game Tools driver); USB-C straight to the PDH for REV Hardware Client.</text>
  <line x1="36" y1="638" x2="76" y2="638" stroke="#FFA700" stroke-width="4"/>
  <text x="86" y="643" font-size="13">CAN: motors and sensors. Tuner X reaches them through the roboRIO's diagnostic server.</text>
</svg>
