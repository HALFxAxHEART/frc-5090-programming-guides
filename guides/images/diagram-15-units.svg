<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Inter, Arial, sans-serif">
<rect width="880" height="330" fill="#ffffff"/>
<text x="440" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#000AB5">From motor rotations to carriage inches (the example in section 1)</text><rect x="20" y="60" width="180" height="110" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/><text x="110" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#16181d">Kraken X60</text><text x="110" y="122" text-anchor="middle" font-size="14" font-weight="400" fill="#16181d">spins</text><text x="110" y="144" text-anchor="middle" font-size="14" font-weight="400" fill="#16181d">1 rotation</text><rect x="30" y="188" width="160" height="34" rx="6" fill="#ffffff" stroke="#FFA700" stroke-width="2.5"/><text x="110" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">1 rotation</text><line x1="204" y1="115" x2="230" y2="115" stroke="#000AB5" stroke-width="3"/><path d="M228,108 L238,115 L228,122 z" fill="#000AB5"/><rect x="240" y="60" width="180" height="110" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/><text x="330" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#16181d">9:1 gearbox</text><text x="330" y="122" text-anchor="middle" font-size="14" font-weight="400" fill="#16181d">output turns</text><text x="330" y="144" text-anchor="middle" font-size="14" font-weight="400" fill="#16181d">9x slower</text><rect x="250" y="188" width="160" height="34" rx="6" fill="#ffffff" stroke="#FFA700" stroke-width="2.5"/><text x="330" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">÷ 9 = 0.111 rot</text><line x1="424" y1="115" x2="450" y2="115" stroke="#000AB5" stroke-width="3"/><path d="M448,108 L458,115 L448,122 z" fill="#000AB5"/><rect x="460" y="60" width="180" height="110" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/><text x="550" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#16181d">22T #25 sprocket</text><text x="550" y="122" text-anchor="middle" font-size="14" font-weight="400" fill="#16181d">pitch diameter 1.757"</text><text x="550" y="144" text-anchor="middle" font-size="14" font-weight="400" fill="#16181d">chain per turn: π × 1.757"</text><rect x="470" y="188" width="160" height="34" rx="6" fill="#ffffff" stroke="#FFA700" stroke-width="2.5"/><text x="550" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">× 5.52" = 0.613"</text><line x1="644" y1="115" x2="670" y2="115" stroke="#000AB5" stroke-width="3"/><path d="M668,108 L678,115 L668,122 z" fill="#000AB5"/><rect x="680" y="60" width="180" height="110" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/><text x="770" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#16181d">2-stage cascade</text><text x="770" y="122" text-anchor="middle" font-size="14" font-weight="400" fill="#16181d">carriage moves</text><text x="770" y="144" text-anchor="middle" font-size="14" font-weight="400" fill="#16181d">2x the chain</text><rect x="690" y="188" width="160" height="34" rx="6" fill="#ffffff" stroke="#FFA700" stroke-width="2.5"/><text x="770" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">× 2 = 1.227"</text><rect x="140" y="246" width="600" height="56" rx="8" fill="#000AB5"/><text x="440" y="271" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">1 motor rotation = 1.227 inches of carriage travel</text><text x="440" y="292" text-anchor="middle" font-size="14" font-weight="400" fill="#ffffff">so 1 inch = 1 / 1.227 = 0.815 motor rotations (kMotorRotationsPerInch)</text></svg>