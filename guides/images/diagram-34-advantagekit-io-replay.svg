<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000AB5"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16181d"/></marker>
  </defs>
  <rect width="880" height="520" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#16181d">AdvantageKit: IO layers on the robot, and replay on a laptop</text>

  <text x="170" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#000AB5">1. On the robot (a match)</text>
  <text x="710" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#000AB5">2. Replay (laptop, later)</text>

  <!-- LEFT stack -->
  <rect x="20" y="82" width="290" height="56" rx="10" fill="#000AB5"/>
  <text x="165" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Elevator (subsystem)</text>
  <text x="165" y="126" text-anchor="middle" font-size="13" fill="#ffffff">logic: setpoints, state machine</text>
  <rect x="20" y="178" width="290" height="50" rx="10" fill="#FFA700"/>
  <text x="165" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#16181d">Logger.processInputs(...)</text>
  <text x="165" y="218" text-anchor="middle" font-size="13" fill="#16181d">saves every input</text>
  <rect x="20" y="268" width="290" height="56" rx="10" fill="#ffffff" stroke="#000AB5" stroke-width="2.5"/>
  <text x="165" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">ElevatorIOTalonFX</text>
  <text x="165" y="312" text-anchor="middle" font-size="13" fill="#16181d">implements ElevatorIO</text>
  <rect x="20" y="364" width="290" height="50" rx="10" fill="#f4f5f9" stroke="#c9ced8" stroke-width="2"/>
  <text x="165" y="394" text-anchor="middle" font-size="14" font-weight="700" fill="#16181d">Krakens + CANcoder</text>

  <!-- left arrows: inputs up (left side), outputs down (right side) -->
  <line x1="80" y1="362" x2="80" y2="328" stroke="#16181d" stroke-width="2" marker-end="url(#k)"/>
  <line x1="80" y1="266" x2="80" y2="232" stroke="#16181d" stroke-width="2" marker-end="url(#k)"/>
  <line x1="80" y1="176" x2="80" y2="142" stroke="#16181d" stroke-width="2" marker-end="url(#k)"/>
  <text x="90" y="252" font-size="13" fill="#16181d">updateInputs()</text>
  <text x="90" y="160" font-size="13" fill="#16181d">inputs</text>
  <path d="M 312 110 L 330 110 L 330 296 L 314 296" fill="none" stroke="#000AB5" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="300" y="256" text-anchor="end" font-size="13" fill="#000AB5">setVoltage()</text>
  <text x="20" y="440" font-size="13" fill="#16181d">Inputs = everything read from hardware,</text>
  <text x="20" y="458" font-size="13" fill="#16181d">plus joysticks, FMS data, dashboard choices.</text>

  <!-- MIDDLE: logs -->
  <rect x="368" y="160" width="134" height="88" rx="8" fill="#ffffff" stroke="#16181d" stroke-width="2"/>
  <text x="435" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">match.wpilog</text>
  <text x="435" y="210" text-anchor="middle" font-size="13" fill="#16181d">all inputs</text>
  <text x="435" y="228" text-anchor="middle" font-size="13" fill="#16181d">+ outputs</text>
  <rect x="368" y="330" width="134" height="88" rx="8" fill="#ffffff" stroke="#16181d" stroke-width="2"/>
  <text x="435" y="360" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">..._sim.wpilog</text>
  <text x="435" y="380" text-anchor="middle" font-size="13" fill="#16181d">new outputs</text>
  <text x="435" y="398" text-anchor="middle" font-size="13" fill="#16181d">(incl. new ones)</text>

  <line x1="312" y1="203" x2="364" y2="203" stroke="#000AB5" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="504" y1="203" x2="568" y2="203" stroke="#000AB5" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="525" y="226" text-anchor="middle" font-size="13" fill="#000AB5">read</text><text x="525" y="242" text-anchor="middle" font-size="13" fill="#000AB5">back</text>

  <!-- RIGHT stack -->
  <rect x="570" y="82" width="290" height="56" rx="10" fill="#000AB5"/>
  <text x="715" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Elevator (same code,</text>
  <text x="715" y="126" text-anchor="middle" font-size="13" fill="#ffffff">maybe with your fix or extra logging)</text>
  <rect x="570" y="178" width="290" height="50" rx="10" fill="#FFA700"/>
  <text x="715" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#16181d">Logger.processInputs(...)</text>
  <text x="715" y="218" text-anchor="middle" font-size="13" fill="#16181d">fills inputs FROM the log</text>
  <rect x="570" y="268" width="290" height="56" rx="10" fill="#ffffff" stroke="#000AB5" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="715" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="#16181d">new ElevatorIO() {}</text>
  <text x="715" y="312" text-anchor="middle" font-size="13" fill="#16181d">empty: does nothing</text>
  <rect x="570" y="364" width="290" height="50" rx="10" fill="#ffffff" stroke="#c9ced8" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="715" y="394" text-anchor="middle" font-size="14" fill="#16181d">no hardware attached</text>

  <line x1="630" y1="176" x2="630" y2="142" stroke="#16181d" stroke-width="2" marker-end="url(#k)"/>
  <text x="640" y="160" font-size="13" fill="#16181d">same inputs, same order</text>
  <path d="M 568 120 L 548 120 L 548 374 L 506 374" fill="none" stroke="#000AB5" stroke-width="2.5" marker-end="url(#a)"/>
  
  <text x="570" y="440" font-size="13" fill="#16181d">Same inputs in, same logic: the code makes</text>
  <text x="570" y="458" font-size="13" fill="#16181d">the same decisions it made in the match.</text>

  <rect x="20" y="478" width="840" height="34" rx="8" fill="#f4f5f9" stroke="#c9ced8"/>
  <text x="440" y="500" text-anchor="middle" font-size="13" fill="#16181d">A third implementation, ElevatorIOSim, swaps in a physics model so the same subsystem runs in normal simulation.</text>
</svg>
