<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Inter, Arial, sans-serif" fill="#16181d">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000AB5"/></marker>
    <marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16181d"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c07d00"/></marker>
  </defs>
  <rect width="880" height="400" fill="#fff"/>
<text x="440" y="30" font-size="19" text-anchor="middle" font-weight="700">Feedforward does most of the work, PID cleans up</text>
  <text x="16" y="220" font-size="15" text-anchor="start" font-weight="700">Setpoint</text>
  <polyline points="88,215 154,215" fill="none" stroke="#000AB5" stroke-width="2" marker-end="url(#ah)"/>
  <circle cx="118" cy="215" r="4" fill="#000AB5"/>
  <polyline points="118,215 118,95 236,95" fill="none" stroke="#c07d00" stroke-width="2.5" marker-end="url(#ahg)"/>
  <text x="126" y="85" font-size="13" text-anchor="start">from setpoint:</text>
  <text x="126" y="117" font-size="13" text-anchor="start">v, a, angle</text>
  <circle cx="170" cy="215" r="16" fill="#fff" stroke="#000AB5" stroke-width="2"/><line x1="162" y1="215" x2="178" y2="215" stroke="#000AB5" stroke-width="2"/><line x1="170" y1="207" x2="170" y2="223" stroke="#000AB5" stroke-width="2"/>
  <text x="146" y="193" font-size="16" text-anchor="start" font-weight="700">+</text>
  <text x="178" y="255" font-size="18" text-anchor="start" font-weight="700">−</text>
  <polyline points="186,215 236,215" fill="none" stroke="#000AB5" stroke-width="2" marker-end="url(#ah)"/>
  <text x="211" y="205" font-size="13" text-anchor="middle" font-weight="700">error</text>
  <rect x="240" y="53" width="250" height="84" rx="8" fill="#fff8e8" stroke="#c07d00" stroke-width="2.5"/>
  <text x="365" y="79" font-size="15" text-anchor="middle" font-weight="700">Feedforward (no error needed)</text>
  <text x="365" y="103" font-size="15" text-anchor="middle">kS·sign + kV·v + kA·a + kG</text>
  <text x="365" y="123" font-size="13" text-anchor="middle" fill="#5a6070">the volts you already know you need</text>
  <rect x="240" y="181" width="250" height="68" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/>
  <text x="365" y="207" font-size="15" text-anchor="middle" font-weight="700">PID (reacts to error)</text>
  <text x="365" y="231" font-size="15" text-anchor="middle">kP·error + kI·sum + kD·rate</text>
  <polyline points="490,95 560,95 560,195" fill="none" stroke="#c07d00" stroke-width="2.5" marker-end="url(#ahg)"/>
  <polyline points="490,215 540,215" fill="none" stroke="#000AB5" stroke-width="2" marker-end="url(#ah)"/>
  <circle cx="560" cy="215" r="16" fill="#fff" stroke="#000AB5" stroke-width="2"/><line x1="552" y1="215" x2="568" y2="215" stroke="#000AB5" stroke-width="2"/><line x1="560" y1="207" x2="560" y2="223" stroke="#000AB5" stroke-width="2"/>
  <text x="568" y="189" font-size="16" text-anchor="start" font-weight="700">+</text>
  <text x="530" y="207" font-size="16" text-anchor="start" font-weight="700">+</text>
  <polyline points="576,215 654,215" fill="none" stroke="#000AB5" stroke-width="2" marker-end="url(#ah)"/>
  <text x="615" y="205" font-size="14" text-anchor="middle" font-weight="700">volts</text>
  <rect x="658" y="187" width="92" height="56" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/>
  <text x="704" y="220" font-size="15" text-anchor="middle" font-weight="700">Motor</text>
  <polyline points="750,215 774,215" fill="none" stroke="#000AB5" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="778" y="187" width="92" height="56" rx="8" fill="#f4f5f9" stroke="#000AB5" stroke-width="2"/>
  <text x="824" y="213" font-size="15" text-anchor="middle" font-weight="700">Mech-</text>
  <text x="824" y="230" font-size="15" text-anchor="middle" font-weight="700">anism</text>
  <polyline points="824,243 824,320 170,320 170,235" fill="none" stroke="#000AB5" stroke-width="2" marker-end="url(#ah)"/>
  <text x="497" y="310" font-size="14" text-anchor="middle">measurement (encoder)</text>
  <text x="440" y="362" font-size="15" text-anchor="middle" font-weight="700">Total output = kS + kV·v + kA·a + kG + kP·error + kI·sum + kD·rate</text>
  <text x="440" y="384" font-size="13" text-anchor="middle" fill="#5a6070">Gold path: computed from the setpoint before anything goes wrong. Blue path: only acts once there is an error.</text>
</svg>
