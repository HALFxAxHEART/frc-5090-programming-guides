<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="Inter, Arial, sans-serif">
<rect width="880" height="450" fill="#ffffff"/>
<text x="440" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#16181d">Same robot, same heading, driver pushes the left stick forward:</text><text x="230" y="68" text-anchor="middle" font-size="19" font-weight="700" fill="#000AB5">Field-centric</text><rect x="40" y="90" width="380" height="250" fill="#f4f5f9" stroke="#c9ced8" stroke-width="2"/><rect x="40" y="340" width="380" height="10" fill="#16181d"/><text x="230" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#16181d">your driver station (you stand here)</text><rect x="195" y="200" width="70" height="70" rx="5" fill="#ffffff" stroke="#000AB5" stroke-width="3"/><rect x="195" y="200" width="10" height="70" fill="#FFA700"/><text x="236" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#000AB5">robot</text><text x="200" y="291" text-anchor="middle" font-size="13" font-weight="700" fill="#16181d">robot front</text><line x1="230" y1="195" x2="230" y2="122" stroke="#000AB5" stroke-width="6"/><path d="M241,122 L230,104 L219,122 z" fill="#000AB5"/><text x="230" y="402" text-anchor="middle" font-size="15" font-weight="400" fill="#16181d">robot drives AWAY FROM YOU,</text><text x="230" y="422" text-anchor="middle" font-size="15" font-weight="400" fill="#16181d">no matter which way it faces</text><text x="650" y="68" text-anchor="middle" font-size="19" font-weight="700" fill="#000AB5">Robot-centric</text><rect x="460" y="90" width="380" height="250" fill="#f4f5f9" stroke="#c9ced8" stroke-width="2"/><rect x="460" y="340" width="380" height="10" fill="#16181d"/><text x="650" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#16181d">your driver station (you stand here)</text><rect x="615" y="200" width="70" height="70" rx="5" fill="#ffffff" stroke="#000AB5" stroke-width="3"/><rect x="615" y="200" width="10" height="70" fill="#FFA700"/><text x="656" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#000AB5">robot</text><text x="620" y="291" text-anchor="middle" font-size="13" font-weight="700" fill="#16181d">robot front</text><line x1="610" y1="235" x2="496" y2="235" stroke="#000AB5" stroke-width="6"/><path d="M496,224 L478,235 L496,246 z" fill="#000AB5"/><text x="650" y="402" text-anchor="middle" font-size="15" font-weight="400" fill="#16181d">robot drives toward ITS OWN FRONT,</text><text x="650" y="422" text-anchor="middle" font-size="15" font-weight="400" fill="#16181d">wherever that points</text></svg>